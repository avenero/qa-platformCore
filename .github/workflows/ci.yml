name: CI - KiuA-leon Core

on:
  pull_request:
    branches: [ develop, master ]
  push:
    branches: [ develop, master ]

# Evitar ejecuciones paralelas en la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests · Coverage · Static Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    # Modo estricto activo por defecto (2026-05-12): Checkstyle y SpotBugs
    # rompen el build en cualquier PR si encuentran violaciones. Baseline
    # cleanup completo (NeedBraces, MagicNumber, LineLength, UnusedImports).
    env:
      STRICT_FLAG: '-Pstrict'

    steps:

      # ── Checkout completo ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── JDK 21 (Temurin — distribución Eclipse, 100% open source) ────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Cache Gradle (wrapper + caches) ───────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Permisos Gradle Wrapper ───────────────────────────────────────────────
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # ── Playwright browsers (headless CI) ────────────────────────────────────
      - name: Install Playwright browsers
        working-directory: web-core
        run: npx playwright install --with-deps chromium

      # ── Unit Tests + JaCoCo ───────────────────────────────────────────────────
      # --continue: no abortar si un módulo falla; reportar todos los resultados
      - name: Run unit tests and generate JaCoCo coverage
        run: ./gradlew test jacocoTestReport --continue --no-daemon -Dplaywright.headless.compatibility=true
        env:
          CI: true

      # ── Checkstyle (estilo de código / code smells) ────────────────────────────
      # -Pstrict siempre activo: cualquier violación falla el build.
      - name: Run Checkstyle static analysis
        run: ./gradlew checkstyleMain --continue --no-daemon ${{ env.STRICT_FLAG }}

      # ── SpotBugs (detección de bugs / vulnerabilidades) ───────────────────────
      - name: Run SpotBugs analysis
        run: ./gradlew spotbugsMain --continue --no-daemon ${{ env.STRICT_FLAG }}

      # ── Artefactos: Resultados de Tests ──────────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 30

      # ── Artefactos: Reportes JaCoCo (HTML navegable + XML) ──────────────────
      - name: Upload JaCoCo coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports-${{ github.run_number }}
          path: '**/build/reports/jacoco/'
          retention-days: 30

      # ── Artefactos: Reportes de Análisis Estático ────────────────────────────
      - name: Upload static analysis reports (Checkstyle + SpotBugs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-${{ github.run_number }}
          path: |
            **/build/reports/checkstyle/
            **/build/reports/spotbugs/
          retention-days: 30
