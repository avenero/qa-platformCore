name: Publish - KiuA-leon Core

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Release Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # -Pstrict: activa ignoreFailures=false en Checkstyle y SpotBugs.
      # --continue: ejecuta todas las tareas para obtener todos los reportes.
      # El job falla (bloqueando el publish) si hay test failures, violaciones de
      # estilo o bugs detectados.
      - name: Run release validation
        run: ./gradlew test jacocoTestReport checkstyleMain spotbugsMain --continue --no-daemon -Pstrict
        env:
          CI: true

  publish:
    name: Publish to GitHub Packages
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Guard release version
        run: |
          VERSION=$(./gradlew properties --no-daemon -q | sed -n 's/^version: //p')
          if echo "$VERSION" | grep -q 'SNAPSHOT$'; then
            echo "Refusing to publish SNAPSHOT version: $VERSION"
            exit 1
          fi

      - name: Publish all modules to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
