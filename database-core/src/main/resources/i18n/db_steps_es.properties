# ── Categorias ────────────────────────────────────────────────────────────────
step.db.category.setup=Configuración de BD
step.db.category.execution=Ejecución SQL
step.db.category.assertions=Aserciones
step.db.category.transactions=Transacciones

# ── Parámetros comunes ────────────────────────────────────────────────────────
step.db.param.sql=Sentencia SQL a ejecutar (puede incluir parámetros posicionales ?)
step.db.param.params=Parámetros separados por coma para la sentencia SQL (ej: "valor1,valor2")
step.db.then.field.param.field=Nombre de la columna en el resultado
step.db.then.field.param.row=Número de fila del resultado (comienza en 1)
step.db.then.field.param.value=Valor esperado de la columna

# ── Configuración ──────────────────────────────────────────────────────────────
step.db.given.connect.description=Establece la conexión con la base de datos indicada
step.db.given.connect.param.type=Tipo de base de datos (mysql, postgresql, oracle, sqlserver)
step.db.given.connect.param.identifier=Identificador de la configuración de conexión en el entorno
step.db.given.execute-script.description=Ejecuta un script SQL desde un archivo (útil para setup de datos)
step.db.given.execute-script.param.filename=Ruta al archivo SQL a ejecutar

# ── Transacciones ─────────────────────────────────────────────────────────────
step.db.given.begin-tx.description=Inicia una transacción explícita en la conexión activa

# ── Ejecución ─────────────────────────────────────────────────────────────────
step.db.when.query.description=Ejecuta una consulta SELECT y almacena el resultado para aserciones posteriores
step.db.when.query-params.description=Ejecuta una consulta SELECT con parámetros posicionales
step.db.when.query-docstring.description=Ejecuta una consulta SELECT multilínea definida como DocString
step.db.when.execute.description=Ejecuta un DML (INSERT, UPDATE, DELETE) o DDL sin parámetros
step.db.when.execute-params.description=Ejecuta un DML con parámetros posicionales
step.db.when.execute-docstring.description=Ejecuta un DML multilínea definido como DocString
step.db.when.run-statement.description=Ejecuta una sentencia SQL genérica (query o DML)
step.db.when.call-procedure.description=Llama a un procedimiento almacenado por nombre
step.db.when.call-procedure.param.procedure=Nombre del procedimiento almacenado a ejecutar

# ── Transacciones ─────────────────────────────────────────────────────────────
step.db.when.commit.description=Confirma la transacción activa haciendo permanentes los cambios
step.db.when.rollback.description=Deshace la transacción activa revirtiendo todos los cambios

# ── Aserciones ────────────────────────────────────────────────────────────────
step.db.then.row-count.description=Verifica que el resultado de la última consulta tenga exactamente N filas
step.db.then.row-count.param.count=Número exacto de filas esperadas en el resultado
step.db.then.field-equals.description=Verifica que el valor de una columna en una fila específica sea el esperado
step.db.then.field-not-null.description=Verifica que el valor de una columna en una fila específica no sea null
step.db.then.no-rows.description=Verifica que la consulta no retornó ninguna fila
step.db.then.rows-affected.description=Verifica que el último DML afectó exactamente N filas
step.db.then.rows-affected.param.count=Número exacto de filas que se esperaba que el DML afectara
