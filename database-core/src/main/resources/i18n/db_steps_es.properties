# ── Categorias ────────────────────────────────────────────────────────────────
step.db.category.setup=Configuración de BD
step.db.category.execution=Ejecución SQL
step.db.category.assertions=Aserciones
step.db.category.transactions=Transacciones

# ── Parámetros comunes ────────────────────────────────────────────────────────
step.db.param.sql=Sentencia SQL a ejecutar (puede incluir parámetros posicionales ?)
step.db.param.params=Parámetros separados por coma para la sentencia SQL (ej: "valor1,valor2")
step.db.then.field.param.field=Nombre de la columna en el resultado
step.db.then.field.param.row=Número de fila del resultado (comienza en 1)
step.db.then.field.param.value=Valor esperado de la columna

# ── Configuración ──────────────────────────────────────────────────────────────
step.db.given.connect.description=Establece la conexión con la base de datos indicada
step.db.given.connect.param.type=Tipo de base de datos (mysql, postgresql, oracle, sqlserver)
step.db.given.connect.param.identifier=Identificador de la configuración de conexión en el entorno
step.db.given.execute-script.description=Ejecuta un script SQL desde un archivo (útil para setup de datos)
step.db.given.execute-script.param.filename=Ruta al archivo SQL a ejecutar

# ── Transacciones ─────────────────────────────────────────────────────────────
step.db.given.begin-tx.description=Inicia una transacción explícita en la conexión activa

# ── Ejecución ─────────────────────────────────────────────────────────────────
step.db.when.query.description=Ejecuta una consulta SELECT y almacena el resultado para aserciones posteriores
step.db.when.query-params.description=Ejecuta una consulta SELECT con parámetros posicionales
step.db.when.query-docstring.description=Ejecuta una consulta SELECT multilínea definida como DocString
step.db.when.execute.description=Ejecuta un DML (INSERT, UPDATE, DELETE) o DDL sin parámetros
step.db.when.execute-params.description=Ejecuta un DML con parámetros posicionales
step.db.when.execute-docstring.description=Ejecuta un DML multilínea definido como DocString
step.db.when.run-statement.description=Ejecuta una sentencia SQL genérica (query o DML)
step.db.when.call-procedure.description=Llama a un procedimiento almacenado por nombre
step.db.when.call-procedure.param.procedure=Nombre del procedimiento almacenado a ejecutar

# ── Transacciones ─────────────────────────────────────────────────────────────
step.db.when.commit.description=Confirma la transacción activa haciendo permanentes los cambios
step.db.when.rollback.description=Deshace la transacción activa revirtiendo todos los cambios

# ── Aserciones ────────────────────────────────────────────────────────────────
step.db.then.row-count.description=Verifica que el resultado de la última consulta tenga exactamente N filas
step.db.then.row-count.param.count=Número exacto de filas esperadas en el resultado
step.db.then.field-equals.description=Verifica que el valor de una columna en una fila específica sea el esperado
step.db.then.field-not-null.description=Verifica que el valor de una columna en una fila específica no sea null
step.db.then.no-rows.description=Verifica que la consulta no retornó ninguna fila
step.db.then.rows-affected.description=Verifica que el último DML afectó exactamente N filas
step.db.then.rows-affected.param.count=Número exacto de filas que se esperaba que el DML afectara

# Sprint 1 — aserciones avanzadas (numéricas, regex, schema, multi-fila, negativos)
step.db.param.column=Nombre de la columna en el resultado
step.db.param.numeric=Valor numérico (entero o decimal)
step.db.param.row=Número de fila (base 1) en el resultado
step.db.param.value=Valor literal esperado
step.db.param.regex=Expresión regular compatible con Java
step.db.param.variable=Nombre de la variable de contexto donde almacenar
step.db.param.table=Nombre de la tabla
step.db.param.sql-type=Tipo JDBC (ej. VARCHAR, NUMERIC, DECIMAL, TIMESTAMP)
step.db.param.sql-state=Código SQL state esperado (ej. 23505 para violación de unicidad)
step.db.then.col-gt.description=Verifica que el valor de la primera fila sea mayor al umbral
step.db.then.col-lt.description=Verifica que el valor de la primera fila sea menor al umbral
step.db.then.col-gte.description=Verifica que el valor de la primera fila sea mayor o igual al umbral
step.db.then.col-lte.description=Verifica que el valor de la primera fila sea menor o igual al umbral
step.db.then.col-between.description=Verifica que el valor esté entre dos límites inclusivos
step.db.then.col-row-gt.description=Verifica que la columna en una fila específica sea mayor al umbral
step.db.then.col-row-lt.description=Verifica que la columna en una fila específica sea menor al umbral
step.db.then.col-row-gte.description=Verifica que la columna en una fila específica sea mayor o igual al umbral
step.db.then.col-row-lte.description=Verifica que la columna en una fila específica sea menor o igual al umbral
step.db.then.col-row-between.description=Verifica que la columna en una fila esté entre dos límites inclusivos
step.db.then.col-match.description=Verifica que la columna coincida con una expresión regular
step.db.then.col-eq-ci.description=Verifica igualdad de la columna ignorando mayúsculas/minúsculas
step.db.then.col-contains-ci.description=Verifica que la columna contenga substring ignorando mayúsculas/minúsculas
step.db.then.col-null.description=Verifica que el valor de la columna sea SQL NULL
step.db.then.col-not-empty.description=Verifica que la columna no sea null ni cadena vacía
step.db.then.every-row-gt.description=Verifica que toda fila tenga la columna mayor al umbral
step.db.then.at-least-one-row-eq.description=Verifica que al menos una fila tenga la columna igual al valor esperado
step.db.then.table-has-col.description=Verifica que la tabla tenga una columna con el nombre dado
step.db.then.col-type.description=Verifica que la columna sea del tipo JDBC indicado
step.db.then.store-all.description=Almacena todos los valores de una columna en una variable lista de contexto
step.db.when.try-execute.description=Ejecuta un DML esperando que falle, capturando el SQL state
step.db.then.sql-state.description=Verifica que la query previa fallida haya retornado el SQL state indicado

# Conexión genérica — parámetros inline (sin archivo de configuración)
step.db.param.jdbc-url=URL JDBC completa (ej. jdbc:postgresql://host:5432/db, jdbc:oracle:thin:@host:1521/svc)
step.db.param.db-user=Usuario de la base de datos
step.db.param.db-password=Contraseña — preferir interpolación ${ENV_VAR}
step.db.given.connect-with-params.description=Conecta a una base de datos pasando todos los parámetros inline; sin dependencia de archivo de configuración
step.db.given.connect-with-datatable.description=Conecta a una base de datos usando un DataTable con los parámetros (tipo/url/usuario/contraseña)
