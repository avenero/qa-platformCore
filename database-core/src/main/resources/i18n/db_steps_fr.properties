# ── Catégories ────────────────────────────────────────────────────────────────
step.db.category.setup=Configuration BD
step.db.category.execution=Exécution SQL
step.db.category.assertions=Assertions
step.db.category.transactions=Transactions

# ── Paramètres communs ────────────────────────────────────────────────────────
step.db.param.sql=Requête SQL à exécuter (peut inclure des paramètres positionnels ?)
step.db.param.params=Paramètres séparés par virgule pour la requête SQL (ex: "valeur1,valeur2")
step.db.then.field.param.field=Nom de la colonne dans le résultat
step.db.then.field.param.row=Numéro de ligne dans le résultat (commence à 1)
step.db.then.field.param.value=Valeur attendue de la colonne

# ── Configuration ──────────────────────────────────────────────────────────────
step.db.given.connect.description=Établit la connexion avec la base de données indiquée
step.db.given.connect.param.type=Type de base de données (mysql, postgresql, oracle, sqlserver)
step.db.given.connect.param.identifier=Identifiant de configuration de connexion depuis l'environnement
step.db.given.execute-script.description=Exécute un script SQL depuis un fichier (utile pour la préparation des données)
step.db.given.execute-script.param.filename=Chemin vers le fichier SQL à exécuter

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.given.begin-tx.description=Démarre une transaction explicite sur la connexion active

# ── Exécution ─────────────────────────────────────────────────────────────────
step.db.when.query.description=Exécute une requête SELECT et stocke le résultat pour les assertions suivantes
step.db.when.query-params.description=Exécute une requête SELECT avec des paramètres positionnels
step.db.when.query-docstring.description=Exécute une requête SELECT multi-lignes définie comme DocString
step.db.when.execute.description=Exécute un DML (INSERT, UPDATE, DELETE) ou DDL sans paramètres
step.db.when.execute-params.description=Exécute un DML avec des paramètres positionnels
step.db.when.execute-docstring.description=Exécute un DML multi-lignes défini comme DocString
step.db.when.run-statement.description=Exécute une requête SQL générique (requête ou DML)
step.db.when.call-procedure.description=Appelle une procédure stockée par son nom
step.db.when.call-procedure.param.procedure=Nom de la procédure stockée à exécuter

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.when.commit.description=Valide la transaction active, rendant tous les changements permanents
step.db.when.rollback.description=Annule la transaction active, défaisant tous les changements

# ── Assertions ────────────────────────────────────────────────────────────────
step.db.then.row-count.description=Vérifie que le résultat de la dernière requête contient exactement N lignes
step.db.then.row-count.param.count=Nombre exact de lignes attendues dans le résultat
step.db.then.field-equals.description=Vérifie qu'une valeur de colonne dans une ligne spécifique correspond à la valeur attendue
step.db.then.field-not-null.description=Vérifie qu'une valeur de colonne dans une ligne spécifique n'est pas null
step.db.then.no-rows.description=Vérifie que la requête n'a retourné aucune ligne
step.db.then.rows-affected.description=Vérifie que le dernier DML a affecté exactement N lignes
step.db.then.rows-affected.param.count=Nombre exact de lignes que le DML était censé affecter

# Sprint 1 — assertions avancées (numérique, regex, schema, multi-ligne, négatif)
step.db.param.column=Nom de la colonne dans le résultat
step.db.param.numeric=Valeur numérique (entier ou décimal)
step.db.param.row=Numéro de ligne (base 1) dans le résultat
step.db.param.value=Valeur littérale attendue
step.db.param.regex=Expression régulière compatible Java
step.db.param.variable=Nom de la variable de contexte pour le stockage
step.db.param.table=Nom de la table
step.db.param.sql-type=Type JDBC (VARCHAR, NUMERIC, DECIMAL, TIMESTAMP)
step.db.param.sql-state=Code SQL state attendu (ex. 23505 pour violation d'unicité)
step.db.then.col-gt.description=Vérifie que la valeur de la première ligne est supérieure au seuil
step.db.then.col-lt.description=Vérifie que la valeur de la première ligne est inférieure au seuil
step.db.then.col-gte.description=Vérifie que la valeur de la première ligne est supérieure ou égale au seuil
step.db.then.col-lte.description=Vérifie que la valeur de la première ligne est inférieure ou égale au seuil
step.db.then.col-between.description=Vérifie que la valeur est entre deux bornes inclusives
step.db.then.col-row-gt.description=Vérifie qu'une colonne sur une ligne donnée est supérieure au seuil
step.db.then.col-row-lt.description=Vérifie qu'une colonne sur une ligne donnée est inférieure au seuil
step.db.then.col-row-gte.description=Vérifie qu'une colonne sur une ligne donnée est supérieure ou égale au seuil
step.db.then.col-row-lte.description=Vérifie qu'une colonne sur une ligne donnée est inférieure ou égale au seuil
step.db.then.col-row-between.description=Vérifie qu'une colonne sur une ligne est entre deux bornes inclusives
step.db.then.col-match.description=Vérifie que la colonne correspond à une expression régulière
step.db.then.col-eq-ci.description=Vérifie l'égalité de la colonne en ignorant la casse
step.db.then.col-contains-ci.description=Vérifie que la colonne contient une sous-chaîne en ignorant la casse
step.db.then.col-null.description=Vérifie que la valeur de la colonne est SQL NULL
step.db.then.col-not-empty.description=Vérifie que la colonne n'est ni null ni chaîne vide
step.db.then.every-row-gt.description=Vérifie que toute ligne a la colonne supérieure au seuil
step.db.then.at-least-one-row-eq.description=Vérifie qu'au moins une ligne a la colonne égale à la valeur attendue
step.db.then.table-has-col.description=Vérifie que la table contient une colonne avec le nom donné
step.db.then.col-type.description=Vérifie que la colonne est du type JDBC indiqué
step.db.then.store-all.description=Stocke toutes les valeurs d'une colonne dans une variable liste de contexte
step.db.when.try-execute.description=Exécute un DML censé échouer, capturant le SQL state
step.db.then.sql-state.description=Vérifie que la requête précédente échouée a retourné le SQL state donné

# Connexion générique — paramètres inline (sans fichier de configuration)
step.db.param.jdbc-url=URL JDBC complète (ex. jdbc:postgresql://host:5432/db, jdbc:oracle:thin:@host:1521/svc)
step.db.param.db-user=Utilisateur de la base de données
step.db.param.db-password=Mot de passe — préférer l'interpolation ${ENV_VAR}
step.db.given.connect-with-params.description=Se connecte à une base de données en passant tous les paramètres inline; sans fichier de configuration
step.db.given.connect-with-datatable.description=Se connecte à une base de données via un DataTable avec les paramètres (type/url/utilisateur/mot de passe)
