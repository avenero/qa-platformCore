# ── Catégories ────────────────────────────────────────────────────────────────
step.db.category.setup=Configuration BD
step.db.category.execution=Exécution SQL
step.db.category.assertions=Assertions
step.db.category.transactions=Transactions

# ── Paramètres communs ────────────────────────────────────────────────────────
step.db.param.sql=Requête SQL à exécuter (peut inclure des paramètres positionnels ?)
step.db.param.params=Paramètres séparés par virgule pour la requête SQL (ex: "valeur1,valeur2")
step.db.then.field.param.field=Nom de la colonne dans le résultat
step.db.then.field.param.row=Numéro de ligne dans le résultat (commence à 1)
step.db.then.field.param.value=Valeur attendue de la colonne

# ── Configuration ──────────────────────────────────────────────────────────────
step.db.given.connect.description=Établit la connexion avec la base de données indiquée
step.db.given.connect.param.type=Type de base de données (mysql, postgresql, oracle, sqlserver)
step.db.given.connect.param.identifier=Identifiant de configuration de connexion depuis l'environnement
step.db.given.execute-script.description=Exécute un script SQL depuis un fichier (utile pour la préparation des données)
step.db.given.execute-script.param.filename=Chemin vers le fichier SQL à exécuter

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.given.begin-tx.description=Démarre une transaction explicite sur la connexion active

# ── Exécution ─────────────────────────────────────────────────────────────────
step.db.when.query.description=Exécute une requête SELECT et stocke le résultat pour les assertions suivantes
step.db.when.query-params.description=Exécute une requête SELECT avec des paramètres positionnels
step.db.when.query-docstring.description=Exécute une requête SELECT multi-lignes définie comme DocString
step.db.when.execute.description=Exécute un DML (INSERT, UPDATE, DELETE) ou DDL sans paramètres
step.db.when.execute-params.description=Exécute un DML avec des paramètres positionnels
step.db.when.execute-docstring.description=Exécute un DML multi-lignes défini comme DocString
step.db.when.run-statement.description=Exécute une requête SQL générique (requête ou DML)
step.db.when.call-procedure.description=Appelle une procédure stockée par son nom
step.db.when.call-procedure.param.procedure=Nom de la procédure stockée à exécuter

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.when.commit.description=Valide la transaction active, rendant tous les changements permanents
step.db.when.rollback.description=Annule la transaction active, défaisant tous les changements

# ── Assertions ────────────────────────────────────────────────────────────────
step.db.then.row-count.description=Vérifie que le résultat de la dernière requête contient exactement N lignes
step.db.then.row-count.param.count=Nombre exact de lignes attendues dans le résultat
step.db.then.field-equals.description=Vérifie qu'une valeur de colonne dans une ligne spécifique correspond à la valeur attendue
step.db.then.field-not-null.description=Vérifie qu'une valeur de colonne dans une ligne spécifique n'est pas null
step.db.then.no-rows.description=Vérifie que la requête n'a retourné aucune ligne
step.db.then.rows-affected.description=Vérifie que le dernier DML a affecté exactement N lignes
step.db.then.rows-affected.param.count=Nombre exact de lignes que le DML était censé affecter
