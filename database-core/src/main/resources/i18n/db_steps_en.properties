# ── Categories ────────────────────────────────────────────────────────────────
step.db.category.setup=Database Setup
step.db.category.execution=SQL Execution
step.db.category.assertions=Assertions
step.db.category.transactions=Transactions

# ── Common parameters ─────────────────────────────────────────────────────────
step.db.param.sql=SQL statement to execute (may include positional parameters ?)
step.db.param.params=Comma-separated parameters for the SQL statement (e.g. "value1,value2")
step.db.then.field.param.field=Column name in the result set
step.db.then.field.param.row=Row number in the result set (starts at 1)
step.db.then.field.param.value=Expected column value

# ── Setup ─────────────────────────────────────────────────────────────────────
step.db.given.connect.description=Establishes connection to the specified database
step.db.given.connect.param.type=Database type (mysql, postgresql, oracle, sqlserver)
step.db.given.connect.param.identifier=Connection configuration identifier from the environment
step.db.given.execute-script.description=Executes a SQL script from a file (useful for data setup)
step.db.given.execute-script.param.filename=Path to the SQL file to execute

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.given.begin-tx.description=Begins an explicit transaction on the active connection

# ── Execution ─────────────────────────────────────────────────────────────────
step.db.when.query.description=Executes a SELECT query and stores the result for subsequent assertions
step.db.when.query-params.description=Executes a SELECT query with positional parameters
step.db.when.query-docstring.description=Executes a multi-line SELECT query defined as a DocString
step.db.when.execute.description=Executes a DML (INSERT, UPDATE, DELETE) or DDL without parameters
step.db.when.execute-params.description=Executes a DML with positional parameters
step.db.when.execute-docstring.description=Executes a multi-line DML defined as a DocString
step.db.when.run-statement.description=Executes a generic SQL statement (query or DML)
step.db.when.call-procedure.description=Calls a stored procedure by name
step.db.when.call-procedure.param.procedure=Name of the stored procedure to execute

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.when.commit.description=Commits the active transaction, making all changes permanent
step.db.when.rollback.description=Rolls back the active transaction, undoing all changes

# ── Assertions ────────────────────────────────────────────────────────────────
step.db.then.row-count.description=Verifies that the last query result has exactly N rows
step.db.then.row-count.param.count=Exact number of expected rows in the result
step.db.then.field-equals.description=Verifies that a column value in a specific row matches the expected value
step.db.then.field-not-null.description=Verifies that a column value in a specific row is not null
step.db.then.no-rows.description=Verifies that the query returned no rows
step.db.then.rows-affected.description=Verifies that the last DML affected exactly N rows
step.db.then.rows-affected.param.count=Exact number of rows the DML was expected to affect

# Sprint 1 — advanced assertions (numeric, regex, schema, multi-row, negative)
step.db.param.column=Column name in the result set
step.db.param.numeric=Numeric value (integer or decimal)
step.db.param.row=1-indexed row number in the result set
step.db.param.value=Expected literal value
step.db.param.regex=Java-compatible regular expression
step.db.param.variable=Name of the context variable to store data into
step.db.param.table=Database table name
step.db.param.sql-type=JDBC type name (e.g. VARCHAR, NUMERIC, DECIMAL, TIMESTAMP)
step.db.param.sql-state=Expected SQL state code (e.g. 23505 for unique violation)
step.db.then.col-gt.description=Asserts the first row column value is greater than threshold
step.db.then.col-lt.description=Asserts the first row column value is less than threshold
step.db.then.col-gte.description=Asserts the first row column value is greater than or equal to threshold
step.db.then.col-lte.description=Asserts the first row column value is less than or equal to threshold
step.db.then.col-between.description=Asserts the first row column value lies between two inclusive bounds
step.db.then.col-row-gt.description=Asserts the column in a specific row is greater than threshold
step.db.then.col-row-lt.description=Asserts the column in a specific row is less than threshold
step.db.then.col-row-gte.description=Asserts the column in a specific row is greater than or equal to threshold
step.db.then.col-row-lte.description=Asserts the column in a specific row is less than or equal to threshold
step.db.then.col-row-between.description=Asserts the column in a specific row lies between two inclusive bounds
step.db.then.col-match.description=Asserts the column matches a regular expression
step.db.then.col-eq-ci.description=Asserts the column equals the expected value ignoring case
step.db.then.col-contains-ci.description=Asserts the column contains substring ignoring case
step.db.then.col-null.description=Asserts the column value is SQL NULL
step.db.then.col-not-empty.description=Asserts the column is neither null nor an empty string
step.db.then.every-row-gt.description=Asserts every row in the result has the column greater than threshold
step.db.then.at-least-one-row-eq.description=Asserts at least one row in the result has the column equal to expected value
step.db.then.table-has-col.description=Asserts the table has a column with the given name (case-insensitive)
step.db.then.col-type.description=Asserts the column has the given JDBC type
step.db.then.store-all.description=Stores all values of a column from the result set into a context list variable
step.db.when.try-execute.description=Executes a DML expecting it to fail, capturing the SQL state for assertion
step.db.then.sql-state.description=Asserts the previous failed query returned the given SQL state

# Generic connection — inline parameters (no config-file dependency)
step.db.param.jdbc-url=Full JDBC URL (e.g. jdbc:postgresql://host:5432/db, jdbc:oracle:thin:@host:1521/svc)
step.db.param.db-user=Database username
step.db.param.db-password=Database password — prefer ${ENV_VAR} interpolation
step.db.given.connect-with-params.description=Connects to a database providing all parameters inline; no config file required
step.db.given.connect-with-datatable.description=Connects to a database using a DataTable carrying all parameters (type/url/user/password)
