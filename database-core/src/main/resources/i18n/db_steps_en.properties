# ── Categories ────────────────────────────────────────────────────────────────
step.db.category.setup=Database Setup
step.db.category.execution=SQL Execution
step.db.category.assertions=Assertions
step.db.category.transactions=Transactions

# ── Common parameters ─────────────────────────────────────────────────────────
step.db.param.sql=SQL statement to execute (may include positional parameters ?)
step.db.param.params=Comma-separated parameters for the SQL statement (e.g. "value1,value2")
step.db.then.field.param.field=Column name in the result set
step.db.then.field.param.row=Row number in the result set (starts at 1)
step.db.then.field.param.value=Expected column value

# ── Setup ─────────────────────────────────────────────────────────────────────
step.db.given.connect.description=Establishes connection to the specified database
step.db.given.connect.param.type=Database type (mysql, postgresql, oracle, sqlserver)
step.db.given.connect.param.identifier=Connection configuration identifier from the environment
step.db.given.execute-script.description=Executes a SQL script from a file (useful for data setup)
step.db.given.execute-script.param.filename=Path to the SQL file to execute

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.given.begin-tx.description=Begins an explicit transaction on the active connection

# ── Execution ─────────────────────────────────────────────────────────────────
step.db.when.query.description=Executes a SELECT query and stores the result for subsequent assertions
step.db.when.query-params.description=Executes a SELECT query with positional parameters
step.db.when.query-docstring.description=Executes a multi-line SELECT query defined as a DocString
step.db.when.execute.description=Executes a DML (INSERT, UPDATE, DELETE) or DDL without parameters
step.db.when.execute-params.description=Executes a DML with positional parameters
step.db.when.execute-docstring.description=Executes a multi-line DML defined as a DocString
step.db.when.run-statement.description=Executes a generic SQL statement (query or DML)
step.db.when.call-procedure.description=Calls a stored procedure by name
step.db.when.call-procedure.param.procedure=Name of the stored procedure to execute

# ── Transactions ──────────────────────────────────────────────────────────────
step.db.when.commit.description=Commits the active transaction, making all changes permanent
step.db.when.rollback.description=Rolls back the active transaction, undoing all changes

# ── Assertions ────────────────────────────────────────────────────────────────
step.db.then.row-count.description=Verifies that the last query result has exactly N rows
step.db.then.row-count.param.count=Exact number of expected rows in the result
step.db.then.field-equals.description=Verifies that a column value in a specific row matches the expected value
step.db.then.field-not-null.description=Verifies that a column value in a specific row is not null
step.db.then.no-rows.description=Verifies that the query returned no rows
step.db.then.rows-affected.description=Verifies that the last DML affected exactly N rows
step.db.then.rows-affected.param.count=Exact number of rows the DML was expected to affect
