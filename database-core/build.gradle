// =============================================================================
// database-core — Módulo de testing de bases de datos
// TASK-A02: esqueleto inicial
// TASK-A03: migración common/database/ → databasecore (completado)
// TASK-A04: migración lógica DB de http-core → databasecore (completado)
// =============================================================================

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Exponer `common` como API para que sea transitivamente visible a consumidores
    api project(':common')

    // Cucumber para BDD (versiones alineadas con el resto del framework)
    api "io.cucumber:cucumber-java:${rootProject.ext.cucumberVersion}"
    api "io.cucumber:cucumber-junit-platform-engine:${rootProject.ext.cucumberVersion}"

    api 'org.assertj:assertj-core:3.27.7'

    // === DATABASE CONNECTION POOLING (TASK-A06 — movido desde common) ===
    // HikariCP para gestión de pool de conexiones
    api 'com.zaxxer:HikariCP:5.0.1'

    // JDBC Drivers — solo módulos que dependen de database-core los obtienen
    api 'com.mysql:mysql-connector-j:8.4.0'        // CVE-2023-22102 resuelto
    api 'org.postgresql:postgresql:42.7.11'
    api 'com.microsoft.sqlserver:mssql-jdbc:12.8.2.jre11'  // CVE-2025-59250 resuelto
    api 'com.oracle.database.jdbc:ojdbc11:23.2.0.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}

publishing {
    publications.named('mavenJava', MavenPublication) {
        pom {
            name = 'QA Framework - Database Core'
            description = 'Framework de automatización QA - Módulo Database Core para testing de bases de datos (HikariCP, JDBC, multi-BD)'
            url = 'https://github.com/avenero/qa-platformCore'

            licenses {
                license {
                    name = 'Proprietary'
                    url  = 'https://github.com/avenero/qa-platformCore'
                }
            }

            developers {
                developer {
                    id = 'qa-team'
                    name = 'QA Automation Team'
                    email = 'qa-team@internal.com'
                }
            }
        }
    }
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
}
