# ============================================================================

# ??????????????????????????????????????????????????????????????????????????
# INFORMACI?N DEL PROYECTO
# ??????????????????????????????????????????????????????????????????????????
group=com.qa
version=2.0.0


# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE JAVA
# ??????????????????????????????????????????????????????????????????????????
# Versi?n de Java (toolchain configurado en build.gradle)
javaVersion=21

# ??????????????????????????????????????????????????????????????????????????
# OPTIMIZACI?N DE GRADLE
# ??????????????????????????????????????????????????????????????????????????
# Habilitar Gradle Daemon para builds m?s r?pidos
org.gradle.daemon=true

# Ejecuci?n paralela de m?dulos
org.gradle.parallel=true

# Build cache para reutilizar outputs de builds anteriores
org.gradle.caching=true

# Configurar JVM para Gradle (2GB RAM, Garbage Collector G1)
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

# Modo de consola para mejor output en CI/CD
org.gradle.console=plain

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE ENCODING
# ??????????????????????????????????????????????????????????????????????????
# Forzar UTF-8 para evitar problemas en Windows
systemProp.file.encoding=UTF-8

