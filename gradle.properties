coreGroup=com.qa

# ─────────────────────────────────────────────────────────────────────────────
# VERSIÓN DEL CORE  ·  Workflow de publicación
# ─────────────────────────────────────────────────────────────────────────────
#
#  DESARROLLO LOCAL  (por defecto, siempre trabajar en SNAPSHOT)
#    · Sufijo -SNAPSHOT → el build.gradle raíz enruta a publishToMavenLocal (~/.m2/)
#    · Comando: ./gradlew publishToMavenLocal
#    · NO toca GitHub Packages; es inmutable y rechaza reescrituras (409 Conflict)
#
#  RELEASE NUEVA  (cuando el código ya está listo y probado)
#    1. Quitar el sufijo -SNAPSHOT:          coreVersion=2.0.11
#    2. Hacer commit + tag en Git:            git tag v2.0.11 && git push --tags
#    3. Publicar en GitHub Packages:          ./gradlew publish
#    4. Actualizar qa-platformBE y qa-module-test al mismo número sin SNAPSHOT
#    5. Volver a subir la versión:            coreVersion=2.0.12-SNAPSHOT
#
#  REGLA DE ORO
#    · Solo un número puede existir como release en GitHub Packages (inmutable).
#    · Si ya publicaste 2.0.11 y necesitas corregir algo → pasa a 2.0.12-SNAPSHOT.
# ─────────────────────────────────────────────────────────────────────────────
coreVersion=1.0.0-SNAPSHOT

githubPackagesRepoUrl=https://maven.pkg.github.com/avenero/qa-platformCore
