# ============================================================================
# Gradle Properties - Scotia QA Framework
# ============================================================================
#
# Este archivo configura propiedades globales del proyecto que pueden ser
# sobrescritas desde l?nea de comandos o variables de entorno.
#
# @author Abel Venero
# @version 1.0.0
# @date 2026-02-09
# ============================================================================

# ??????????????????????????????????????????????????????????????????????????
# INFORMACI?N DEL PROYECTO
# ??????????????????????????????????????????????????????????????????????????
group=com.scotia.qa
version=1.0.0

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACIÓN DE ARTIFACTORY
# ??????????????????????????????????????????????????????????????????????????
# ?? IMPORTANTE: NO poner credenciales aquí (usar Jenkins credentials)

# URL base de Artifactory (ya configurada en tu proyecto)
artifactoryBaseUrl=https://artifactory.cl-devops-infra.chl.bns/ui/native

# Nombre de repositorio (ACTUALIZAR según tu configuración)
# ??  LIMITACIÓN: Solo tenemos repositorio de releases
# TODO: Consultar con DevOps el nombre exacto
artifactoryReleaseRepo=libs-release-thirdparty

# NOTA: No tenemos repositorio snapshot (libs-snapshot-local)
# Estrategia: Desarrollo local con publishToMavenLocal

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE JAVA
# ??????????????????????????????????????????????????????????????????????????
# Versi?n de Java (toolchain configurado en build.gradle)
javaVersion=21

# ??????????????????????????????????????????????????????????????????????????
# OPTIMIZACI?N DE GRADLE
# ??????????????????????????????????????????????????????????????????????????
# Habilitar Gradle Daemon para builds m?s r?pidos
org.gradle.daemon=true

# Ejecuci?n paralela de m?dulos
org.gradle.parallel=true

# Build cache para reutilizar outputs de builds anteriores
org.gradle.caching=true

# Configurar JVM para Gradle (2GB RAM, Garbage Collector G1)
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m

# Modo de consola para mejor output en CI/CD
org.gradle.console=plain

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE ENCODING
# ??????????????????????????????????????????????????????????????????????????
# Forzar UTF-8 para evitar problemas en Windows
systemProp.file.encoding=UTF-8

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE TESTS
# ??????????????????????????????????????????????????????????????????????????
# Mostrar output de tests en consola (?til para debugging)
# Descomentar si necesitas ver logs detallados durante tests
# org.gradle.logging.level=debug

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE PUBLICACI?N
# ??????????????????????????????????????????????????????????????????????????
# Estas propiedades son inyectadas por Jenkins en CI/CD
# NO configurarlas aqu?, solo documentadas para referencia:
#
# artifactoryUrl      - URL completa del repositorio (con /release o /snapshot)
# artifactoryUser     - Usuario de Artifactory (desde Jenkins credentials)
# artifactoryPassword - Password/Token (desde Jenkins credentials)
#
# Ejemplo de uso desde l?nea de comandos:
# ./gradlew publish \
#   -PartifactoryUrl=https://artifactory.example.com/artifactory/libs-release-local \
#   -PartifactoryUser=jenkins \
#   -PartifactoryPassword=xxx

# ??????????????????????????????????????????????????????????????????????????
# CONFIGURACI?N DE PROXY (si es necesario en tu red corporativa)
# ??????????????????????????????????????????????????????????????????????????
# Descomentar y configurar si tu red requiere proxy
# systemProp.http.proxyHost=proxy.scotia.com
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=proxy.scotia.com
# systemProp.https.proxyPort=8080
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.scotia.com

# ??????????????????????????????????????????????????????????????????????????
# NOTAS IMPORTANTES
# ??????????????????????????????????????????????????????????????????????????
#
# 1. SEGURIDAD:
#    - NUNCA commitear credenciales en este archivo
#    - Usar Jenkins credentials para usuario/password de Artifactory
#    - Considerar tokens en lugar de passwords
#
# 2. VERSIONADO:
#    - La versi?n aqu? es la versi?n BASE
#    - El pipeline.jenkins calcula la versi?n din?mica en runtime
#    - Para releases manuales, actualizar esta versi?n y crear tag Git
#
# 3. PERFORMANCE:
#    - org.gradle.parallel=true puede causar problemas en tests con estado compartido
#    - org.gradle.caching=true es seguro y acelera builds incrementales
#    - Ajustar org.gradle.jvmargs seg?n RAM disponible en agente Jenkins
#
# ============================================================================

