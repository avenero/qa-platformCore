# ── Categories ────────────────────────────────────────────────────────────────
step.http.category.auth=Authentication
step.http.category.request=Request Configuration
step.http.category.execution=Request Execution
step.http.category.status=Status Code
step.http.category.body=Response Body
step.http.category.headers=Response Headers
step.http.category.performance=Performance

# ── Common parameters ─────────────────────────────────────────────────────────
step.http.when.param.path=Path relative to the configured base URL (e.g. /api/users/1)
step.http.then.field.param.jsonPath=JSONPath expression of the field (e.g. $.data.id)
step.http.then.field.param.value=Expected value of the field
step.http.then.header.param.name=HTTP header name (e.g. Content-Type)
step.http.then.header.param.value=Expected header value
step.http.then.array-size.param.size=Exact number of expected elements in the array

# ── Authentication ────────────────────────────────────────────────────────────
step.http.given.base-url.description=Sets the base URL for all requests in the scenario
step.http.given.base-url.param.url=Full base URL (e.g. https://api.example.com)
step.http.given.bearer.description=Adds Bearer Token authentication to the Authorization header
step.http.given.bearer.param.token=Bearer authentication token (without "Bearer " prefix)
step.http.given.basic-auth.description=Configures Basic Auth with username and password
step.http.given.basic-auth.param.username=Username for authentication
step.http.given.basic-auth.param.password=User password

# ── Request Configuration ──────────────────────────────────────────────────────
step.http.given.header.description=Adds or overrides an HTTP header in the request
step.http.given.header.param.name=HTTP header name
step.http.given.header.param.value=Header value
step.http.given.query-param.description=Adds a query string parameter to the request URL
step.http.given.query-param.param.name=Query parameter name
step.http.given.query-param.param.value=Query parameter value
step.http.given.content-type.description=Sets the Content-Type of the request body
step.http.given.content-type.param.value=MIME content type (e.g. application/json)
step.http.given.body-inline.description=Defines the request body as inline text (JSON, XML, etc.)
step.http.given.body-file.description=Reads the request body from a file on the filesystem
step.http.given.body-file.param.filename=Path to the file containing the request body
step.http.request-body.description=Sets the HTTP request body content (JSON, XML, plain text)
step.http.request-body.param.body=Request body content; supports variable interpolation

# ── Execution ─────────────────────────────────────────────────────────────────
step.http.when.get.description=Sends a GET request to the specified path
step.http.when.post.description=Sends a POST request to the specified path
step.http.when.post-body.description=Sends a POST request with inline body to the specified path
step.http.when.put.description=Sends a PUT request to the specified path
step.http.when.put-body.description=Sends a PUT request with inline body to the specified path
step.http.when.patch.description=Sends a PATCH request to the specified path
step.http.when.patch-body.description=Sends a PATCH request with inline body to the specified path
step.http.when.delete.description=Sends a DELETE request to the specified path
step.http.when.head.description=Sends a HEAD request to the specified path (returns headers only)
step.http.when.get-params.description=Sends a GET request with query parameters defined in a table

# ── Status Code ───────────────────────────────────────────────────────────────
step.http.then.status.description=Verifies that the HTTP response status code matches the expected value
step.http.then.status.param.statusCode=Expected HTTP status code (e.g. 200, 201, 404, 422)

# ── Response Body ──────────────────────────────────────────────────────────────
step.http.then.body-contains.description=Verifies that the response body contains the specified text
step.http.then.body-contains.param.text=Text that must be present in the response body
step.http.then.field-equals.description=Verifies that the specified JSON field equals the expected value
step.http.then.field-not-null.description=Verifies that the specified JSON field is not null
step.http.then.field-null.description=Verifies that the specified JSON field is null
step.http.then.field-true.description=Verifies that the specified JSON boolean field is true
step.http.then.field-false.description=Verifies that the specified JSON boolean field is false
step.http.then.field-array-size.description=Verifies that the JSON array has exactly N elements

# ── Response Headers ───────────────────────────────────────────────────────────
step.http.then.header-equals.description=Verifies that the response header has the exact expected value
step.http.then.header-present.description=Verifies that the response header is present

# ── Performance ───────────────────────────────────────────────────────────────
step.http.then.response-time.description=Verifies that the response time is below the specified threshold
step.http.then.response-time.param.ms=Maximum response time in milliseconds
