# ── Catégories ────────────────────────────────────────────────────────────────
step.http.category.auth=Authentification
step.http.category.request=Configuration de la Requête
step.http.category.execution=Exécution des Requêtes
step.http.category.status=Code de Statut
step.http.category.body=Corps de Réponse
step.http.category.headers=En-têtes de Réponse
step.http.category.performance=Performance

# ── Paramètres communs ────────────────────────────────────────────────────────
step.http.when.param.path=Chemin relatif à l'URL de base configurée (ex: /api/utilisateurs/1)
step.http.then.field.param.jsonPath=Expression JSONPath du champ (ex: $.data.id)
step.http.then.field.param.value=Valeur attendue du champ
step.http.then.header.param.name=Nom de l'en-tête HTTP (ex: Content-Type)
step.http.then.header.param.value=Valeur attendue de l'en-tête
step.http.then.array-size.param.size=Nombre exact d'éléments attendus dans le tableau

# ── Authentification ───────────────────────────────────────────────────────────
step.http.given.base-url.description=Définit l'URL de base pour toutes les requêtes du scénario
step.http.given.base-url.param.url=URL de base complète (ex: https://api.example.com)
step.http.given.bearer.description=Ajoute une authentification Bearer Token à l'en-tête Authorization
step.http.given.bearer.param.token=Token d'authentification Bearer (sans le préfixe "Bearer ")
step.http.given.basic-auth.description=Configure l'authentification Basic Auth avec identifiant et mot de passe
step.http.given.basic-auth.param.username=Nom d'utilisateur pour l'authentification
step.http.given.basic-auth.param.password=Mot de passe de l'utilisateur

# ── Configuration de la Requête ───────────────────────────────────────────────
step.http.given.header.description=Ajoute ou remplace un en-tête HTTP dans la requête
step.http.given.header.param.name=Nom de l'en-tête HTTP
step.http.given.header.param.value=Valeur de l'en-tête
step.http.given.query-param.description=Ajoute un paramètre query string à l'URL de la requête
step.http.given.query-param.param.name=Nom du paramètre query
step.http.given.query-param.param.value=Valeur du paramètre query
step.http.given.content-type.description=Définit le Content-Type du corps de la requête
step.http.given.content-type.param.value=Type de contenu MIME (ex: application/json)
step.http.given.body-inline.description=Définit le corps de la requête comme texte inline (JSON, XML, etc.)
step.http.given.body-file.description=Lit le corps de la requête depuis un fichier du système
step.http.given.body-file.param.filename=Chemin vers le fichier contenant le corps de la requête
step.http.request-body.description=Définit le corps de la requête HTTP (JSON, XML, texte brut)
step.http.request-body.param.body=Contenu du corps de la requête; prend en charge l'interpolation des variables

# ── Exécution ─────────────────────────────────────────────────────────────────
step.http.when.get.description=Envoie une requête GET au chemin indiqué
step.http.when.post.description=Envoie une requête POST au chemin indiqué
step.http.when.post-body.description=Envoie une requête POST avec corps inline au chemin indiqué
step.http.when.put.description=Envoie une requête PUT au chemin indiqué
step.http.when.put-body.description=Envoie une requête PUT avec corps inline au chemin indiqué
step.http.when.patch.description=Envoie une requête PATCH au chemin indiqué
step.http.when.patch-body.description=Envoie une requête PATCH avec corps inline au chemin indiqué
step.http.when.delete.description=Envoie une requête DELETE au chemin indiqué
step.http.when.head.description=Envoie une requête HEAD au chemin indiqué (retourne uniquement les en-têtes)
step.http.when.get-params.description=Envoie une requête GET avec des paramètres query définis dans un tableau

# ── Code de Statut ────────────────────────────────────────────────────────────
step.http.then.status.description=Vérifie que le code de statut HTTP de la réponse correspond à la valeur attendue
step.http.then.status.param.statusCode=Code HTTP attendu (ex: 200, 201, 404, 422)

# ── Corps de Réponse ──────────────────────────────────────────────────────────
step.http.then.body-contains.description=Vérifie que le corps de la réponse contient le texte indiqué
step.http.then.body-contains.param.text=Texte devant être présent dans le corps de la réponse
step.http.then.field-equals.description=Vérifie que le champ JSON indiqué est égal à la valeur attendue
step.http.then.field-not-null.description=Vérifie que le champ JSON indiqué n'est pas null
step.http.then.field-null.description=Vérifie que le champ JSON indiqué est null
step.http.then.field-true.description=Vérifie que le champ JSON booléen est true
step.http.then.field-false.description=Vérifie que le champ JSON booléen est false
step.http.then.field-array-size.description=Vérifie que le tableau JSON contient exactement N éléments

# ── En-têtes de Réponse ───────────────────────────────────────────────────────
step.http.then.header-equals.description=Vérifie que l'en-tête de réponse a la valeur exacte attendue
step.http.then.header-present.description=Vérifie que l'en-tête de réponse est présent dans la réponse

# ── Performance ───────────────────────────────────────────────────────────────
step.http.then.response-time.description=Vérifie que le temps de réponse est inférieur au seuil indiqué
step.http.then.response-time.param.ms=Temps de réponse maximum en millisecondes
