# ── Categorias ────────────────────────────────────────────────────────────────
step.http.category.auth=Autenticación
step.http.category.request=Configuración de Request
step.http.category.execution=Ejecución de Requests
step.http.category.status=Código de Estado
step.http.category.body=Cuerpo de Respuesta
step.http.category.headers=Cabeceras de Respuesta
step.http.category.performance=Rendimiento
step.http.category.security=Seguridad

# ── Parámetros comunes ────────────────────────────────────────────────────────
step.http.when.param.path=Ruta relativa al base URL configurado (ej: /api/users/1)
step.http.then.field.param.jsonPath=Expresión JSONPath del campo (ej: $.data.id)
step.http.then.field.param.value=Valor esperado del campo
step.http.then.header.param.name=Nombre de la cabecera HTTP (ej: Content-Type)
step.http.then.header.param.value=Valor esperado de la cabecera
step.http.then.array-size.param.size=Número exacto de elementos esperados en el array

# ── Autenticación ──────────────────────────────────────────────────────────────
step.http.given.base-url.description=Establece la URL base para todas las peticiones del escenario
step.http.given.base-url.param.url=URL base completa (ej: https://api.example.com)
step.http.given.bearer.description=Añade autenticación Bearer Token en el header Authorization
step.http.given.bearer.param.token=Token de autenticación Bearer (sin prefijo "Bearer ")
step.http.given.basic-auth.description=Configura autenticación Basic Auth con usuario y contraseña
step.http.given.basic-auth.param.username=Nombre de usuario para autenticación
step.http.given.basic-auth.param.password=Contraseña del usuario

# ── Configuración de Request ───────────────────────────────────────────────────
step.http.given.header.description=Agrega o sobreescribe un header HTTP en la petición
step.http.given.header.param.name=Nombre del header HTTP
step.http.given.header.param.value=Valor del header
step.http.given.query-param.description=Agrega un parámetro query string a la URL de la petición
step.http.given.query-param.param.name=Nombre del parámetro query
step.http.given.query-param.param.value=Valor del parámetro query
step.http.given.content-type.description=Establece el Content-Type del body de la petición
step.http.given.content-type.param.value=Tipo de contenido MIME (ej: application/json)
step.http.given.body-inline.description=Define el cuerpo de la petición como texto (JSON, XML, etc.)
step.http.given.body-file.description=Lee el cuerpo de la petición desde un archivo del sistema
step.http.given.body-file.param.filename=Ruta al archivo que contiene el cuerpo de la petición

# ── Ejecución ─────────────────────────────────────────────────────────────────
step.http.when.get.description=Envía una petición GET a la ruta indicada
step.http.when.post.description=Envía una petición POST a la ruta indicada
step.http.when.post-body.description=Envía una petición POST con body inline a la ruta indicada
step.http.when.put.description=Envía una petición PUT a la ruta indicada
step.http.when.put-body.description=Envía una petición PUT con body inline a la ruta indicada
step.http.when.patch.description=Envía una petición PATCH a la ruta indicada
step.http.when.patch-body.description=Envía una petición PATCH con body inline a la ruta indicada
step.http.when.delete.description=Envía una petición DELETE a la ruta indicada
step.http.when.head.description=Envía una petición HEAD a la ruta indicada (solo retorna headers)
step.http.when.get-params.description=Envía una petición GET con query parameters definidos en tabla

# ── Código de Estado ──────────────────────────────────────────────────────────
step.http.then.status.description=Verifica que el código de estado HTTP de la respuesta sea el esperado
step.http.then.status.param.statusCode=Código HTTP esperado (ej: 200, 201, 404, 422)

# ── Cuerpo de Respuesta ───────────────────────────────────────────────────────
step.http.then.body-contains.description=Verifica que el cuerpo de la respuesta contiene el texto indicado
step.http.then.body-contains.param.text=Texto que debe estar presente en el cuerpo de la respuesta
step.http.then.field-equals.description=Verifica que el campo JSON indicado sea igual al valor esperado
step.http.then.field-not-null.description=Verifica que el campo JSON indicado no sea null
step.http.then.field-null.description=Verifica que el campo JSON indicado sea null
step.http.then.field-true.description=Verifica que el campo JSON booleano sea true
step.http.then.field-false.description=Verifica que el campo JSON booleano sea false
step.http.then.field-array-size.description=Verifica que el array JSON tenga exactamente N elementos

# ── Cabeceras de Respuesta ────────────────────────────────────────────────────
step.http.then.header-equals.description=Verifica que el header de respuesta tenga el valor exacto esperado
step.http.then.header-present.description=Verifica que el header de respuesta esté presente en la respuesta

# ── Rendimiento ───────────────────────────────────────────────────────────────
step.http.then.response-time.description=Verifica que el tiempo de respuesta sea menor al umbral indicado
step.http.then.response-time.param.ms=Tiempo máximo de respuesta en milisegundos
