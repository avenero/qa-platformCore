// =============================================================================
// ROOT BUILD — CuAleon Test Engineering Platform
// Aplicar plugins externos aquí con 'apply false'; los subproyectos los aplican
// mediante 'apply plugin:' dentro del bloque subprojects {}
// =============================================================================
plugins {
    id "com.github.spotbugs"           version "6.5.1"  apply false
    id "com.github.ben-manes.versions" version "0.54.0"
}

group = findProperty("coreGroup") ?: "com.qa"
version = findProperty("coreVersion") ?: "0.0.0-SNAPSHOT"

ext {
    cucumberVersion = "7.34.3"
    jacksonVersion  = "2.18.2"
}

// =============================================================================
// CONFIGURACIÓN COMÚN A TODOS LOS SUBMÓDULOS
// =============================================================================
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // =========================================================================
    // CHECKSTYLE — Análisis estático de estilo / code smells
    // =========================================================================
    checkstyle {
        toolVersion    = "10.21.0"
        configFile     = rootProject.file("config/checkstyle/checkstyle.xml")
        // En modo 'strict' (publish o master CI) los errores rompen el build.
        // En modo normal (develop) se reportan sin bloquear.
        ignoreFailures = !project.hasProperty('strict')
        showViolations = false
    }
    // Solo analizar fuentes principales; los tests tienen reglas más relajadas
    tasks.named('checkstyleTest').configure { enabled = false }

    // =========================================================================
    // SPOTBUGS — Detección de bugs y code smells
    // =========================================================================
    spotbugs {
        toolVersion    = "4.9.8"
        ignoreFailures = !project.hasProperty('strict')
        effort         = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
        reportLevel    = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
        excludeFilter  = rootProject.file("config/spotbugs/exclude.xml")
    }
    // SpotBugs 4.9.x bundle BCEL 6.10+ que requiere commons-lang3 ≥ 3.18 (uso de
    // SystemProperties.getJdkModulePath, added en 3.18). Sin este pin, Gradle resuelve
    // una versión transitiva más vieja → NoSuchMethodError al arrancar SpotBugs.
    afterEvaluate {
        configurations.matching { it.name == 'spotbugs' }.configureEach {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.apache.commons'
                        && details.requested.name == 'commons-lang3') {
                    details.useVersion '3.19.0'
                    details.because 'SpotBugs/BCEL needs commons-lang3 ≥ 3.18'
                }
            }
        }
    }
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            xml  { required = true  }
            html { required = false }
        }
    }
    // No analizar tests con SpotBugs (demasiados false-positives en código de tests)
    tasks.named('spotbugsTest').configure { enabled = false }

    // =========================================================================
    // ENCODING UTF-8
    // =========================================================================
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    }

    // =========================================================================
    // DEPENDENCIAS DE TEST COMUNES
    // junit-platform-launcher debe ser explícito para evitar deprecación en Gradle 9.0
    // =========================================================================
    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // TASK-H01: ArchUnit como guard de arquitectura. Cada módulo declara su
        // ArchitectureTest en src/test/java/.../arch/. Reglas se irán añadiendo en
        // TASK-H02 (módulos no se cruzan), TASK-H03 (common no importa especializados),
        // TASK-H04 (BE solo importa common). Versión 1.4.0 — alineada con qa-platformBE.
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'
    }

    // =========================================================================
    // CONFIGURACIÓN DE TESTS
    // =========================================================================
    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        def logbackPath = rootProject.file('config/logback-test.xml').absolutePath.replace('\\', '/')
        systemProperty 'logback.configurationFile', logbackPath
        systemProperty 'jansi.force', 'true'
        systemProperty 'jansi.passthrough', 'false'
        systemProperty 'qa.logs.verbose', System.getProperty('qa.logs.verbose', 'false')

        testLogging {
            // Gradle 8.14+: space-call setter `events "p", "f", "s"` esta deprecated; asignacion
            // explicita con `events = [...]` es idiomatica y a prueba de Gradle 9/10.
            events           = ["passed", "failed", "skipped"]
            exceptionFormat  = 'full'
            showExceptions   = true
            showCauses       = true
            showStackTraces  = true
            displayGranularity = 1
            showStandardStreams = false
        }

        jvmArgs '-Xmx2048m', '-XX:+UseG1GC'
        outputs.upToDateWhen { false }

        // Finalizar generando reporte de cobertura automáticamente
        finalizedBy 'jacocoTestReport'
    }

    // =========================================================================
    // JACOCO — Cobertura de código
    // =========================================================================
    jacoco {
        toolVersion = '0.8.12'
    }

    tasks.named('jacocoTestReport').configure {
        dependsOn 'test'
        reports {
            xml.required  = true
            html.required = true
            csv.required  = false
        }
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/model/**',
                '**/exceptions/**',
                '**/enums/**',
                '**/*Exception*'
            ])
        }))
    }

    // =========================================================================
    // JAVADOC Y SOURCES
    // =========================================================================
    java {
        withJavadocJar()
        withSourcesJar()
    }

    javadoc {
        options.encoding = 'UTF-8'
        options.charSet  = 'UTF-8'
        options.author   = true
        options.version  = true
        options.links    = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
        failOnError      = false
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    // =========================================================================
    // PUBLICACIÓN CENTRALIZADA
    // Estrategia:
    //   - SNAPSHOT  → publishToMavenLocal  (desarrollo local, sin tocar GitHub)
    //   - Release   → GitHubPackages       (artefacto estable para otros proyectos)
    // Comandos:
    //   ./gradlew publish               (publica según versión: Local o GitHub)
    //   ./gradlew publishToMavenLocal   (siempre local, útil en CI local)
    // =========================================================================
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                groupId = project.group
                artifactId = project.name
                version = project.version
            }
        }
        repositories {
            if (project.version.toString().endsWith('-SNAPSHOT')) {
                maven {
                    name = "MavenLocal"
                    url = uri("${System.getProperty('user.home')}/.m2/repository")
                }
            } else {
                maven {
                    name = "GitHubPackages"
                    url = uri(findProperty("githubPackagesRepoUrl") ?: "https://maven.pkg.github.com/avenero/qa-platformCore")
                    credentials {
                        username = System.getenv("GITHUB_ACTOR") ?: findProperty("gpr.user") ?: ""
                        password = System.getenv("GITHUB_TOKEN") ?: findProperty("gpr.token") ?: ""
                    }
                }
            }
        }
    }
}

// =============================================================================
// TASK-J03 — generateComponentCatalog
// Aggregate task que regenera los `<module>/COMPONENTS.md` de los 4 módulos
// especializados ejecutando el test JUnit `*ComponentCatalogTest` por módulo.
// El test funciona como guard anti-drift en CI; este wrapper expone un alias
// ergonómico para devs que quieren regenerar manualmente:
//
//   ./gradlew generateComponentCatalog
//
// El test es idempotente: reescribe el MD con el mismo contenido si los
// `StepComponent` no cambiaron.
// =============================================================================
tasks.register('generateComponentCatalog') {
    group       = 'documentation'
    description = 'Regenera <module>/COMPONENTS.md para http-core, web-core, mobile-core y database-core (TASK-J03).'
    dependsOn ':http-core:test',
              ':web-core:test',
              ':mobile-core:test',
              ':database-core:test'
    doLast {
        ['http-core', 'web-core', 'mobile-core', 'database-core'].each { m ->
            def f = file("${m}/COMPONENTS.md")
            if (f.exists()) {
                logger.lifecycle("  ✓ ${m}/COMPONENTS.md (${f.length()} bytes)")
            } else {
                logger.warn("  ⚠ ${m}/COMPONENTS.md no fue generado — revisar el ${m.replace('-core', 'core')}.catalog test")
            }
        }
    }
}
