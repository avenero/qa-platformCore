// =============================================================================
// ROOT BUILD — CuAleon Test Engineering Platform
// Aplicar plugins externos aquí con 'apply false'; los subproyectos los aplican
// mediante 'apply plugin:' dentro del bloque subprojects {}
// =============================================================================
plugins {
    id "com.github.spotbugs"           version "6.5.1"  apply false
    id "com.github.ben-manes.versions" version "0.54.0"
}

group = findProperty("coreGroup") ?: "com.qa"
version = findProperty("coreVersion") ?: "0.0.0-SNAPSHOT"

ext {
    cucumberVersion = "7.34.3"
}

// =============================================================================
// CONFIGURACIÓN COMÚN A TODOS LOS SUBMÓDULOS
// =============================================================================
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // =========================================================================
    // CHECKSTYLE — Análisis estático de estilo / code smells
    // =========================================================================
    checkstyle {
        toolVersion    = "10.21.0"
        configFile     = rootProject.file("config/checkstyle/checkstyle.xml")
        // En modo 'strict' (publish o master CI) los errores rompen el build.
        // En modo normal (develop) se reportan sin bloquear.
        ignoreFailures = !project.hasProperty('strict')
        showViolations = false
    }
    // Solo analizar fuentes principales; los tests tienen reglas más relajadas
    tasks.named('checkstyleTest').configure { enabled = false }

    // =========================================================================
    // SPOTBUGS — Detección de bugs y code smells
    // =========================================================================
    spotbugs {
        toolVersion    = "4.9.8"
        ignoreFailures = !project.hasProperty('strict')
        effort         = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
        reportLevel    = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
        excludeFilter  = rootProject.file("config/spotbugs/exclude.xml")
    }
    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            xml  { required = true  }
            html { required = false }
        }
    }
    // No analizar tests con SpotBugs (demasiados false-positives en código de tests)
    tasks.named('spotbugsTest').configure { enabled = false }

    // =========================================================================
    // ENCODING UTF-8
    // =========================================================================
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    }

    // =========================================================================
    // DEPENDENCIAS DE TEST COMUNES
    // junit-platform-launcher debe ser explícito para evitar deprecación en Gradle 9.0
    // =========================================================================
    dependencies {
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // =========================================================================
    // CONFIGURACIÓN DE TESTS
    // =========================================================================
    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        def logbackPath = rootProject.file('config/logback-test.xml').absolutePath.replace('\\', '/')
        systemProperty 'logback.configurationFile', logbackPath
        systemProperty 'jansi.force', 'true'
        systemProperty 'jansi.passthrough', 'false'
        systemProperty 'qa.logs.verbose', System.getProperty('qa.logs.verbose', 'false')

        testLogging {
            events "passed", "failed", "skipped"
            exceptionFormat  = 'full'
            showExceptions   = true
            showCauses       = true
            showStackTraces  = true
            displayGranularity = 1
            showStandardStreams = false
        }

        jvmArgs '-Xmx2048m', '-XX:+UseG1GC'
        outputs.upToDateWhen { false }

        // Finalizar generando reporte de cobertura automáticamente
        finalizedBy 'jacocoTestReport'
    }

    // =========================================================================
    // JACOCO — Cobertura de código
    // =========================================================================
    jacoco {
        toolVersion = '0.8.12'
    }

    tasks.named('jacocoTestReport').configure {
        dependsOn 'test'
        reports {
            xml.required  = true
            html.required = true
            csv.required  = false
        }
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/model/**',
                '**/exceptions/**',
                '**/enums/**',
                '**/*Exception*'
            ])
        }))
    }

    // =========================================================================
    // JAVADOC Y SOURCES
    // =========================================================================
    java {
        withJavadocJar()
        withSourcesJar()
    }

    javadoc {
        options.encoding = 'UTF-8'
        options.charSet  = 'UTF-8'
        options.author   = true
        options.version  = true
        options.links    = ['https://docs.oracle.com/en/java/javase/21/docs/api/']
        failOnError      = false
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    // =========================================================================
    // PUBLICACIÓN CENTRALIZADA
    // Estrategia:
    //   - SNAPSHOT  → publishToMavenLocal  (desarrollo local, sin tocar GitHub)
    //   - Release   → GitHubPackages       (artefacto estable para otros proyectos)
    // Comandos:
    //   ./gradlew publish               (publica según versión: Local o GitHub)
    //   ./gradlew publishToMavenLocal   (siempre local, útil en CI local)
    // =========================================================================
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                groupId = project.group
                artifactId = project.name
                version = project.version
            }
        }
        repositories {
            if (project.version.toString().endsWith('-SNAPSHOT')) {
                maven {
                    name = "MavenLocal"
                    url = uri("${System.getProperty('user.home')}/.m2/repository")
                }
            } else {
                maven {
                    name = "GitHubPackages"
                    url = uri(findProperty("githubPackagesRepoUrl") ?: "https://maven.pkg.github.com/avenero/qa-platformCore")
                    credentials {
                        username = System.getenv("GITHUB_ACTOR") ?: findProperty("gpr.user") ?: ""
                        password = System.getenv("GITHUB_TOKEN") ?: findProperty("gpr.token") ?: ""
                    }
                }
            }
        }
    }
}
