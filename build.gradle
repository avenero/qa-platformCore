// Configuración del proyecto raíz qa-framework
group = "com.scotia.qa"
version = "1.0.0"  // Versión inicial estable con todas las mejoras implementadas

// ========================================================================
// CONFIGURACIÓN SSL GLOBAL PARA GRADLE (antes de subprojects)
// ========================================================================
// Configura el truststore para que Gradle pueda descargar dependencias desde Artifactory
def trustStorePath = file("${rootProject.projectDir}/common/ssl/myTrustStore.jks")
if (trustStorePath.exists()) {
    def normalizedPath = trustStorePath.absolutePath.replace('\\', '/')

    // Configurar SSL para todas las operaciones de Gradle
    System.setProperty('javax.net.ssl.trustStore', normalizedPath)
    System.setProperty('javax.net.ssl.trustStorePassword', 'changeit')
    System.setProperty('javax.net.ssl.trustStoreType', 'PKCS12')

    println "🔐 SSL Truststore configurado globalmente para Gradle: ${normalizedPath}"
} else {
    println "⚠️  myTrustStore.jks no encontrado - SSL podría fallar con Artifactory"
}

// Configuración para todos los submódulos
subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = "com.scotia.qa"
    version = "1.0.0"

    repositories {
        // ═══════════════════════════════════════════════════════════════════
        // DESCARGA DE DEPENDENCIAS (dependencies)
        // ═══════════════════════════════════════════════════════════════════
        // Estrategia de búsqueda en CASCADA:
        // 1. mavenLocal      → Rápido (framework publicado localmente)
        // 2. Artifactory     → Red corporativa (dependencias externas)
        // 3. mavenCentral    → Fallback (puede estar bloqueado por firewall)
        //
        // Flag -PuseArtifactory=true:
        //   → Cambia el ORDEN (Artifactory primero, luego mavenLocal)
        //   → Útil para CI/CD que siempre descarga desde Artifactory
        // ═══════════════════════════════════════════════════════════════════

        if (project.hasProperty('useArtifactory') && project.property('useArtifactory') == 'true') {
            // CI/CD: Priorizar Artifactory
            maven { url 'https://artifactory.cldevops.chl.bns/artifactory/external-repository' }
            mavenLocal()
        } else {
            // Desarrollo: Priorizar mavenLocal y mavenCentral, Artifactory como último recurso
            mavenLocal()
            maven { url 'https://artifactory.cldevops.chl.bns/artifactory/external-repository' }

        }
    }


    // ========================================================================
    // CONFIGURACIÓN DE ENCODING UTF-8 (Soluciona errores en Windows)
    // ========================================================================
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'

        // Mostrar warnings de unchecked operations y deprecations
        options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
    }


    tasks.withType(Test) {
        useJUnitPlatform()

        // ═══════════════════════════════════════════════════════════════════
        // CONFIGURACIÓN CENTRALIZADA DE LOGGING PARA TESTS
        // ═══════════════════════════════════════════════════════════════════

        // Normalizar ruta de logback para Windows (evita problemas con backslashes)
        def logbackPath = rootProject.file('config/logback-test.xml').absolutePath.replace('\\', '/')
        systemProperty 'logback.configurationFile', logbackPath

        // Habilitar colores ANSI en consola (Jansi - funciona en Windows)
        systemProperty 'jansi.force', 'true'
        systemProperty 'jansi.passthrough', 'false'  // false para que Gradle no interfiera

        // Habilitar modo verbose de logs (opcional, por defecto false)
        systemProperty 'qa.logs.verbose',
                      System.getProperty('qa.logs.verbose', 'false')

        // Configuración de test logging optimizada
        testLogging {
            // Mostrar solo eventos importantes (NO showStandardStreams para preservar colores)
            events "passed", "failed", "skipped"

            // Mostrar excepciones completas solo en fallos
            exceptionFormat = 'full'
            showExceptions = true
            showCauses = true
            showStackTraces = true

            // Nivel de detalle (0=quiet, 1=lifecycle, 2=info)
            displayGranularity = 1

            // NO capturar stdout/stderr (deja que Logback maneje colores)
            showStandardStreams = false
        }

        // Configuración JVM para mejor performance
        jvmArgs '-Xmx2048m', '-XX:+UseG1GC'

        // Forzar colores en terminal
        outputs.upToDateWhen { false }
    }

    // ========================================================================
    // GENERACIÓN DE JAVADOC Y SOURCES
    // ========================================================================

    // Generar JavaDoc JAR
    java {
        withJavadocJar()
        withSourcesJar()
    }

    // Configurar JavaDoc task
    javadoc {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.author = true
        options.version = true
        options.links = [
            'https://artifactory.cldevops.chl.bns/ui/native/external-repository/javadoc/javadoc'
        ]

        // Ignorar errores en JavaDoc (para no bloquear el build)
        failOnError = false

        // Opciones adicionales
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    // ========================================================================
    // PUBLICACIÓN (Publishing)
    // ========================================================================
    // Configuración de publicación Maven para submódulos sin configuración propia
    afterEvaluate {
        // Solo aplicar si el módulo no tiene su propia configuración de publicación
        if (!project.name.equals('api-core')) {
            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        from components.java
                        groupId = project.group
                        artifactId = project.name
                        version = project.version

                        // JavaDoc y Sources ya incluidos por withJavadocJar() y withSourcesJar()
                        // NO agregar manualmente para evitar duplicados
                    }
                }
                repositories {
                    // ═══════════════════════════════════════════════════════════════
                    // PUBLICACIÓN: mavenLocal o Artifactory
                    // ═══════════════════════════════════════════════════════════════
                    // Detecta automáticamente si se está usando Jenkins/CI
                    // mediante las propiedades -PartifactoryUrl, -PartifactoryUser, -PartifactoryPassword
                    //
                    // USO LOCAL:
                    //   ./gradlew publishToMavenLocal
                    //   → Publica en ~/.m2/repository/com/scotia/qa/
                    //
                    // USO CI/CD (Jenkins):
                    //   ./gradlew publish -PartifactoryUrl=... -PartifactoryUser=... -PartifactoryPassword=...
                    //   → Publica en Artifactory
                    // ═══════════════════════════════════════════════════════════════

                    // Publicación local (por defecto)
                    mavenLocal()

                    // Publicación a Artifactory (si se proporcionan credenciales)
                    if (project.hasProperty('artifactoryUrl') &&
                        project.hasProperty('artifactoryUser') &&
                        project.hasProperty('artifactoryPassword')) {

                        maven {
                            name = 'Artifactory'
                            url = project.property('artifactoryUrl')

                            credentials {
                                username = project.property('artifactoryUser')
                                password = project.property('artifactoryPassword')
                            }

                            // ═══════════════════════════════════════════════════════════
                            // PROTECCIÓN CONTRA SOBRESCRITURA
                            // ═══════════════════════════════════════════════════════════
                            // SNAPSHOTS: Se pueden sobrescribir (desarrollo continuo)
                            // RELEASES: NO se pueden sobrescribir (inmutabilidad)
                            //
                            // Artifactory rechazará automáticamente duplicados de release
                            // con error 409 (Conflict) si ya existe la versión
                            // ═══════════════════════════════════════════════════════════

                            // Configuración de seguridad
                            allowInsecureProtocol = false

                            // Configuración Maven específica para manejo de duplicados
                            // Nota: Artifactory maneja esto en el lado del servidor,
                            // pero esta configuración previene intentos innecesarios
                        }
                    }
                }
            }
        }
    }
}