# ── Categories ────────────────────────────────────────────────────────────────
step.mobile.category.app=Application
step.mobile.category.interaction=Interaction
step.mobile.category.forms=Forms
step.mobile.category.scroll=Scroll
step.mobile.category.gestures=Gestures
step.mobile.category.device=Device
step.mobile.category.assertions=Assertions
step.mobile.category.permissions=Permissions

# ── Common parameters ─────────────────────────────────────────────────────────
step.mobile.param.locator=Visible text, accessibility ID or element selector
step.mobile.param.container=Selector of the parent container
step.mobile.param.index=Element index when multiple exist (starts at 1)
step.mobile.param.value=Value to enter
step.mobile.param.accessibilityId=Accessibility ID of the element (content-desc on Android, accessibilityLabel on iOS)
step.mobile.param.resourceId=Resource ID of the element (format: com.app.id:id/element)
step.mobile.param.xpath=XPath expression of the element
step.mobile.param.text=Visible text shown on the screen
step.mobile.param.label=Accessibility label of the field or button
step.mobile.when.picker.param.option=Option to select in the picker
step.mobile.when.picker.param.picker=Picker name or label
step.mobile.when.permission.param=System permission name (e.g. camera, location, microphone)

# ── App ───────────────────────────────────────────────────────────────────────
step.mobile.app.running.description=Verifies that the application is running
step.mobile.app.screen.description=Verifies that the application is on the specified screen
step.mobile.app.screen.param.screen=Expected screen name or Activity
step.mobile.app.foreground.description=Verifies that the application is in the foreground
step.mobile.app.background.description=Verifies that the application is in the background
step.mobile.app.relaunch.description=Closes and reopens the application
step.mobile.app.reset.description=Resets the application to its initial state (clears data and cache)

# ── Basic Interaction ─────────────────────────────────────────────────────────
step.mobile.when.tap.description=Taps the element identified by visible text, label or selector
step.mobile.when.double-tap.description=Double-taps the specified element
step.mobile.when.long-press.description=Long presses the element to trigger the long-press action menu
step.mobile.when.tap-inside.description=Taps an element within a specific container
step.mobile.when.tap-nth.description=Taps the n-th element with the specified text or selector
step.mobile.when.tap-accessibility.description=Taps the element identified by its Accessibility ID
step.mobile.when.tap-resource-id.description=Taps the element identified by its Android Resource ID
step.mobile.when.tap-xpath.description=Taps the element identified by an XPath expression

# ── Forms ─────────────────────────────────────────────────────────────────────
step.mobile.when.fill.description=Types a value into the field identified by text or selector
step.mobile.when.fill-nth.description=Types a value into the n-th field with the given label
step.mobile.when.fill-accessibility.description=Types into the field identified by its Accessibility ID
step.mobile.when.fill-resource-id.description=Types into the field identified by its Android Resource ID
step.mobile.when.fill-xpath.description=Types into the field identified by an XPath expression
step.mobile.when.clear.description=Clears the current content of the specified field
step.mobile.when.picker.description=Selects a value from a native iOS or Android picker

# ── Scroll ────────────────────────────────────────────────────────────────────
step.mobile.when.scroll-down.description=Scrolls the screen downward
step.mobile.when.scroll-up.description=Scrolls the screen upward
step.mobile.when.scroll-left.description=Scrolls horizontally to the left
step.mobile.when.scroll-right.description=Scrolls horizontally to the right
step.mobile.when.scroll-down-until.description=Scrolls down until the element is visible
step.mobile.when.scroll-up-until.description=Scrolls up until the element is visible

# ── Gestures ──────────────────────────────────────────────────────────────────
step.mobile.when.swipe-left.description=Swipes the element to the left (e.g. delete in lists)
step.mobile.when.swipe-right.description=Swipes the element to the right (e.g. reveal actions)
step.mobile.when.pinch-zoom-in.description=Applies a pinch gesture to zoom in on the element
step.mobile.when.pinch-zoom-out.description=Applies a pinch gesture to zoom out on the element

# ── Device ────────────────────────────────────────────────────────────────────
step.mobile.when.back.description=Presses the physical or virtual back button (Android)
step.mobile.when.home.description=Presses the Home button to go to the home screen
step.mobile.when.hide-keyboard.description=Hides the soft keyboard if visible

# ── Permissions ───────────────────────────────────────────────────────────────
step.mobile.when.grant-permission.description=Grants the system permission requested by the application
step.mobile.when.deny-permission.description=Denies the system permission requested by the application

# ── Assertions ────────────────────────────────────────────────────────────────
step.mobile.then.see-text.description=Verifies that the given text is visible on the screen
step.mobile.then.not-see-text.description=Verifies that the given text is not visible on the screen
step.mobile.then.field-contains.description=Verifies that the mobile field contains the expected value
step.mobile.then.button-enabled.description=Verifies that the mobile button is enabled
step.mobile.then.button-disabled.description=Verifies that the mobile button is disabled
step.mobile.then.screen-view.description=Verifies that the screen shows the specified view
step.mobile.then.a11y-visible.description=Verifies that the element with the given Accessibility ID is visible
step.mobile.then.a11y-not-visible.description=Verifies that the element with the given Accessibility ID is not visible
