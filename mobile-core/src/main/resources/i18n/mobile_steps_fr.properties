# ── Catégories ────────────────────────────────────────────────────────────────
step.mobile.category.app=Application
step.mobile.category.interaction=Interaction
step.mobile.category.forms=Formulaires
step.mobile.category.scroll=Défilement
step.mobile.category.gestures=Gestes
step.mobile.category.device=Appareil
step.mobile.category.assertions=Assertions
step.mobile.category.permissions=Permissions

# ── Paramètres communs ────────────────────────────────────────────────────────
step.mobile.param.locator=Texte visible, identifiant d'accessibilité ou sélecteur de l'élément
step.mobile.param.container=Sélecteur du conteneur parent
step.mobile.param.index=Index de l'élément quand plusieurs existent (commence à 1)
step.mobile.param.value=Valeur à saisir
step.mobile.param.accessibilityId=Accessibility ID de l'élément (content-desc sur Android, accessibilityLabel sur iOS)
step.mobile.param.resourceId=Resource ID de l'élément (format: com.app.id:id/element)
step.mobile.param.xpath=Expression XPath de l'élément
step.mobile.when.picker.param.option=Option à sélectionner dans le picker
step.mobile.when.picker.param.picker=Nom ou label du picker
step.mobile.when.permission.param=Nom de la permission système (ex: camera, location, microphone)

# ── Application ───────────────────────────────────────────────────────────────
step.mobile.app.running.description=Vérifie que l'application est en cours d'exécution
step.mobile.app.screen.description=Vérifie que l'application est sur l'écran indiqué
step.mobile.app.screen.param.screen=Nom d'écran ou Activity attendu
step.mobile.app.foreground.description=Vérifie que l'application est au premier plan
step.mobile.app.background.description=Vérifie que l'application est en arrière-plan
step.mobile.app.relaunch.description=Ferme et rouvre l'application
step.mobile.app.reset.description=Réinitialise l'application à son état initial (efface données et cache)

# ── Interaction de base ────────────────────────────────────────────────────────
step.mobile.when.tap.description=Appuie sur l'élément identifié par texte visible, label ou sélecteur
step.mobile.when.double-tap.description=Effectue un double appui sur l'élément indiqué
step.mobile.when.long-press.description=Maintient l'appui sur l'élément pour activer le menu d'actions longues
step.mobile.when.tap-inside.description=Appuie sur un élément à l'intérieur d'un conteneur spécifique
step.mobile.when.tap-nth.description=Appuie sur le n-ième élément avec le texte ou sélecteur indiqué
step.mobile.when.tap-accessibility.description=Appuie sur l'élément identifié par son Accessibility ID
step.mobile.when.tap-resource-id.description=Appuie sur l'élément identifié par son Resource ID Android
step.mobile.when.tap-xpath.description=Appuie sur l'élément identifié par une expression XPath

# ── Formulaires ───────────────────────────────────────────────────────────────
step.mobile.when.fill.description=Saisit une valeur dans le champ identifié par texte ou sélecteur
step.mobile.when.fill-nth.description=Saisit une valeur dans le n-ième champ avec le label indiqué
step.mobile.when.fill-accessibility.description=Saisit dans le champ identifié par son Accessibility ID
step.mobile.when.fill-resource-id.description=Saisit dans le champ identifié par son Resource ID Android
step.mobile.when.fill-xpath.description=Saisit dans le champ identifié par une expression XPath
step.mobile.when.clear.description=Efface le contenu actuel du champ indiqué
step.mobile.when.picker.description=Sélectionne une valeur dans un picker natif iOS ou Android

# ── Défilement ────────────────────────────────────────────────────────────────
step.mobile.when.scroll-down.description=Fait défiler l'écran vers le bas
step.mobile.when.scroll-up.description=Fait défiler l'écran vers le haut
step.mobile.when.scroll-left.description=Fait défiler horizontalement vers la gauche
step.mobile.when.scroll-right.description=Fait défiler horizontalement vers la droite
step.mobile.when.scroll-down-until.description=Fait défiler vers le bas jusqu'à ce que l'élément soit visible
step.mobile.when.scroll-up-until.description=Fait défiler vers le haut jusqu'à ce que l'élément soit visible

# ── Gestes ────────────────────────────────────────────────────────────────────
step.mobile.when.swipe-left.description=Glisse l'élément vers la gauche (ex: supprimer dans les listes)
step.mobile.when.swipe-right.description=Glisse l'élément vers la droite (ex: révéler des actions)
step.mobile.when.pinch-zoom-in.description=Applique un geste de pincement pour zoomer sur l'élément
step.mobile.when.pinch-zoom-out.description=Applique un geste de pincement pour dézoomer sur l'élément

# ── Appareil ──────────────────────────────────────────────────────────────────
step.mobile.when.back.description=Appuie sur le bouton retour physique ou virtuel (Android)
step.mobile.when.home.description=Appuie sur le bouton Accueil pour retourner à l'écran principal
step.mobile.when.hide-keyboard.description=Masque le clavier virtuel s'il est visible

# ── Permissions ───────────────────────────────────────────────────────────────
step.mobile.when.grant-permission.description=Accorde la permission système demandée par l'application
step.mobile.when.deny-permission.description=Refuse la permission système demandée par l'application
