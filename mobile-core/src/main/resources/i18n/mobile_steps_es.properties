# ── Categorias ────────────────────────────────────────────────────────────────
step.mobile.category.app=Aplicación
step.mobile.category.interaction=Interacción
step.mobile.category.forms=Formularios
step.mobile.category.scroll=Desplazamiento
step.mobile.category.gestures=Gestos
step.mobile.category.device=Dispositivo
step.mobile.category.assertions=Aserciones
step.mobile.category.permissions=Permisos

# ── Parámetros comunes ────────────────────────────────────────────────────────
step.mobile.param.locator=Texto visible, accesibilidad ID o selector del elemento
step.mobile.param.container=Selector del contenedor padre
step.mobile.param.index=Índice del elemento cuando hay múltiples (comienza en 1)
step.mobile.param.value=Valor a ingresar
step.mobile.param.accessibilityId=Accessibility ID del elemento (atributo content-desc en Android, accessibilityLabel en iOS)
step.mobile.param.resourceId=Resource ID del elemento (formato: com.app.id:id/element)
step.mobile.param.xpath=Expresión XPath del elemento
step.mobile.when.picker.param.option=Opción a seleccionar en el picker
step.mobile.when.picker.param.picker=Nombre o label del picker
step.mobile.when.permission.param=Nombre del permiso del sistema (ej: camera, location, microphone)

# ── App ───────────────────────────────────────────────────────────────────────
step.mobile.app.running.description=Verifica que la aplicación está ejecutándose
step.mobile.app.screen.description=Verifica que la aplicación está en la pantalla indicada
step.mobile.app.screen.param.screen=Nombre de la pantalla o Activity esperada
step.mobile.app.foreground.description=Verifica que la aplicación está en primer plano
step.mobile.app.background.description=Verifica que la aplicación está en segundo plano
step.mobile.app.relaunch.description=Cierra y vuelve a abrir la aplicación
step.mobile.app.reset.description=Reinicia la aplicación al estado inicial (limpia datos y cache)

# ── Interacción básica ────────────────────────────────────────────────────────
step.mobile.when.tap.description=Toca el elemento identificado por texto visible, label o selector
step.mobile.when.double-tap.description=Realiza doble toque sobre el elemento indicado
step.mobile.when.long-press.description=Mantiene pulsado el elemento para activar el menú de acciones largas
step.mobile.when.tap-inside.description=Toca un elemento dentro de un contenedor específico
step.mobile.when.tap-nth.description=Toca el n-ésimo elemento con el texto o selector indicado
step.mobile.when.tap-accessibility.description=Toca el elemento identificado por su Accessibility ID
step.mobile.when.tap-resource-id.description=Toca el elemento identificado por su Resource ID de Android
step.mobile.when.tap-xpath.description=Toca el elemento identificado por expresión XPath

# ── Formularios ───────────────────────────────────────────────────────────────
step.mobile.when.fill.description=Escribe un valor en el campo identificado por texto o selector
step.mobile.when.fill-nth.description=Escribe un valor en el n-ésimo campo con el label indicado
step.mobile.when.fill-accessibility.description=Escribe en el campo identificado por su Accessibility ID
step.mobile.when.fill-resource-id.description=Escribe en el campo identificado por su Resource ID de Android
step.mobile.when.fill-xpath.description=Escribe en el campo identificado por expresión XPath
step.mobile.when.clear.description=Borra el contenido actual del campo indicado
step.mobile.when.picker.description=Selecciona un valor de un picker nativo de iOS o Android

# ── Desplazamiento ────────────────────────────────────────────────────────────
step.mobile.when.scroll-down.description=Desplaza la pantalla hacia abajo
step.mobile.when.scroll-up.description=Desplaza la pantalla hacia arriba
step.mobile.when.scroll-left.description=Desplaza horizontalmente hacia la izquierda
step.mobile.when.scroll-right.description=Desplaza horizontalmente hacia la derecha
step.mobile.when.scroll-down-until.description=Desplaza hacia abajo hasta que el elemento sea visible
step.mobile.when.scroll-up-until.description=Desplaza hacia arriba hasta que el elemento sea visible

# ── Gestos ────────────────────────────────────────────────────────────────────
step.mobile.when.swipe-left.description=Desliza el elemento hacia la izquierda (ej: eliminar en listas)
step.mobile.when.swipe-right.description=Desliza el elemento hacia la derecha (ej: revelar acciones)
step.mobile.when.pinch-zoom-in.description=Aplica gesto de pellizco para hacer zoom in sobre el elemento
step.mobile.when.pinch-zoom-out.description=Aplica gesto de pellizco para hacer zoom out sobre el elemento

# ── Dispositivo ───────────────────────────────────────────────────────────────
step.mobile.when.back.description=Presiona el botón físico o virtual de retroceso (Android)
step.mobile.when.home.description=Presiona el botón Home para ir a la pantalla principal
step.mobile.when.hide-keyboard.description=Oculta el teclado virtual si está visible

# ── Permisos ──────────────────────────────────────────────────────────────────
step.mobile.when.grant-permission.description=Otorga el permiso del sistema solicitado por la aplicación
step.mobile.when.deny-permission.description=Deniega el permiso del sistema solicitado por la aplicación
