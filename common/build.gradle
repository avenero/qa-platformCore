// Configuración específica del módulo common - CORE GENÉRICO (v1.1.0)
// Solo dependencias verdaderamente comunes a TODOS los frameworks

plugins {
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {


    // === CONFIGURACIÓN Y PROCESAMIENTO DE ARCHIVOS ===
    // JSON processing básico (para DataUtilities y ConfigurationProvider)
    api "com.fasterxml.jackson.core:jackson-core:${rootProject.ext.jacksonVersion}"
    api "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"
    api "com.fasterxml.jackson.core:jackson-annotations:${rootProject.ext.jacksonVersion}"
    api "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${rootProject.ext.jacksonVersion}"

    // JSON library básica (para DataUtilities)
    api 'org.json:json:20251224'

    // YAML processing (para ConfigurationProvider)
    api 'org.yaml:snakeyaml:2.2'

    // === LOGGING ===
    api 'org.slf4j:slf4j-api:2.0.9'
    api 'ch.qos.logback:logback-classic:1.5.32'  // Actualizado para resolver CVE-2025-11226 y CVE-2026-1225
    api 'org.fusesource.jansi:jansi:2.4.3'  // Para colores ANSI en consola

    // === CUCUMBER (para hooks y contexto comunes) ===
    api "io.cucumber:cucumber-java:${rootProject.ext.cucumberVersion}"

    // === UTILIDADES GENERALES ===
    api 'org.apache.commons:commons-lang3:3.20.0'

    // === TESTING FRAMEWORKS (base común) ===
    api 'org.junit.jupiter:junit-jupiter:5.10.0'
    api 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    api 'org.junit.jupiter:junit-jupiter-api:5.10.0'

    // === SEGURIDAD Y ENCRIPTACIÓN (genérico) ===
    api 'org.bouncycastle:bcprov-jdk18on:1.84'

    // === UTILIDADES DE ARCHIVO E I/O ===
    api 'commons-io:commons-io:2.22.0'

    // === JSON PATH & JSON COMPARISON (usado por DataUtilities) ===
    api 'com.jayway.jsonpath:json-path:2.9.0'
    api 'org.skyscreamer:jsonassert:1.5.1'

    // Forzar versión segura de json-smart (dependencia transitiva de json-path)
    // Resuelve CVE-2024-57699 (HIGH - Uncontrolled Recursion/DoS vulnerability)
    api 'net.minidev:json-smart:2.6.0'

    // === REPORTING (Extent Reports para HTML reports) ===
    api 'com.aventstack:extentreports:5.1.2'

    // === HTTP CLIENT (para Jira integration) ===
    api 'org.apache.httpcomponents:httpclient:4.5.14'
    api 'org.apache.httpcomponents:httpmime:4.5.14'

    // Forzar versión segura de commons-codec (dependencia transitiva de httpclient)
    // Resuelve WS-2019-0379 (Input Validation vulnerability)
    api 'commons-codec:commons-codec:1.22.0'

    // ========================================================================
    // NOTAS DE ARQUITECTURA:
    //
    // HikariCP y los drivers JDBC se declararon aquí temporalmente hasta TASK-A06.
    // Desde TASK-A06 (2026-05-07) viven en database-core/build.gradle:
    // - Son específicos del dominio DB — no todos los módulos los necesitan
    // - Un proyecto que solo importa web-core o http-core no debe cargar ~30MB de drivers
    // - http-core y web-core solo dependen de :common (sin DB)
    //
    // Otras dependencias en http-core:
    // - Unirest (HTTP client avanzado, deprecado — se elimina en TASK-J01)
    // - JSON Schema Validator (solo para API REST)
    // - HTTP Components (específico API)
    // ========================================================================

    // ========================================================================
    // DEPENDENCIAS DE TEST
    // ========================================================================

    // JUnit 5 ya está en 'api' arriba, pero agregamos extras para tests
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'

    // Mocking
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'

    // Assertions mejoradas
    testImplementation 'org.assertj:assertj-core:3.27.7'  // Actualizado para resolver CVE-2026-24400 (XXE vulnerability)

    // JSON testing
    testImplementation 'net.javacrumbs.json-unit:json-unit-assertj:2.38.0'

    // Concurrency testing
    testImplementation 'org.awaitility:awaitility:4.3.0'
}

// ========================================================================
// CONFIGURACIÓN DE TESTS
// ========================================================================

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }

    // Configuración de memoria para tests
    minHeapSize = "256m"
    maxHeapSize = "1024m"
}

// ========================================================================
// JACOCO - COBERTURA DE CÓDIGO
// ========================================================================

jacoco {
    toolVersion = '0.8.11'
}

tasks.named('jacocoTestReport').configure {
    dependsOn 'test'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            '**/model/**',        // POJOs
            '**/exceptions/**',   // Excepciones simples
            '**/enums/**'         // Enums
        ])
    }))
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.25  // Fase 3 post-cleanup: eliminadas ~3500 líneas de clases
                                // obsoletas (providers, logging, Jira, WebDriverManager).
                                // Umbral reducido temporalmente; restaurar a 0.60 al
                                // agregar tests para runtime, reporting y database.
            }
        }
    }
}

tasks.named('check').configure { dependsOn tasks.named('jacocoTestCoverageVerification') }


// NOTA: La configuración de publicación está en el build.gradle raíz
// Para publicar: ./gradlew :common:publishToMavenLocal


