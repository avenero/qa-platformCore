# Test configuration file for ConfigManager tests
# Ambiente: qa (default)

# Basic values
test.string.simple=testValue
test.string.empty=
test.number.int=42
test.number.long=9999999999
test.boolean.true=true
test.boolean.false=false

# Environment variables resolution
test.env.resolved=${TEST_VAR}
test.env.notfound=${VAR_NOT_EXISTS}

# Multiple variables
test.env.multiple=${VAR1}_${VAR2}

# Nested resolution
test.nested.level1=${BASE_URL}
test.nested.level2=${BASE_URL}/api/v1

# Database config (typical use case)
db.host=${DB_HOST}
db.port=5432
db.name=testdb
db.url=jdbc:postgresql://${DB_HOST}:5432/testdb

# API config
api.base.url=${API_BASE_URL}
api.timeout=30000
api.retry.max=3

# Special characters
test.special.url=https://test.com/path?param=value&other=123
test.special.json={"key":"value"}

