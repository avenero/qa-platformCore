# ── Categorias ────────────────────────────────────────────────────────────────
step.web.category.navigation=Navegación
step.web.category.interaction=Interacción
step.web.category.forms=Formularios
step.web.category.assertions=Aserciones
step.web.category.wait=Esperas
step.web.category.config=Configuración

# ── Paramétros comunes ────────────────────────────────────────────────────────
step.web.click.param.locator=Texto visible, label o selector del elemento
step.web.click.param.container=Selector del contenedor padre
step.web.click.param.row=Índice de fila (comienza en 1)
step.web.scroll.pixels.param.pixels=Número de píxeles a desplazar
step.web.assert.text.param.text=Texto esperado dentro del elemento
step.web.assert.title.param.title=Título exacto esperado de la página
step.web.assert.url-contains.param.fragment=Fragmento de URL esperado en la barra de dirección

# ── Configuración ──────────────────────────────────────────────────────────────
step.web.config.navigate.description=Navega directamente a la URL indicada al inicio del escenario
step.web.config.navigate.param.url=URL o ruta relativa a la que navegar

# ── Navegación ───────────────────────────────────────────────────────────────
step.web.navigation.go.description=Navega al URL indicado en el navegador
step.web.navigation.go.param.url=URL completa o ruta relativa de destino

step.web.navigation.new-tab.description=Abre una nueva pestaña en el navegador
step.web.navigation.maximize.description=Maximiza la ventana del navegador a pantalla completa
step.web.navigation.key.description=Presiona la tecla indicada (ej: Enter, Tab, Escape)
step.web.navigation.key.param.key=Nombre de la tecla (ej: Enter, Tab, F5)
step.web.navigation.combo.description=Presiona una combinación de teclas (ej: Ctrl+S)
step.web.navigation.combo.param.modifier=Tecla modificadora (ej: Control, Shift, Alt)
step.web.navigation.combo.param.key=Tecla secundaria de la combinación

# ── Frame ─────────────────────────────────────────────────────────────────────
step.web.frame.leave.description=Sale del iframe activo y vuelve al contexto principal del documento

# ── Clicks e Interacción ──────────────────────────────────────────────────────
step.web.click.click.description=Hace clic en el elemento identificado por texto visible o selector
step.web.click.click-inside.description=Hace clic en un elemento dentro de un contenedor específico
step.web.click.click-row.description=Hace clic en un elemento dentro de una fila específica de la tabla
step.web.click.double-click.description=Realiza doble clic sobre el elemento indicado
step.web.click.right-click.description=Realiza clic derecho sobre el elemento para abrir el menú contextual
step.web.click.hover.description=Sitúa el cursor sobre el elemento para activar efectos de hover

# ── Drag and Drop ─────────────────────────────────────────────────────────────
step.web.drag.drop.description=Arrastra un elemento y lo suelta sobre un elemento destino
step.web.drag.drop.param.source=Selector CSS o XPath del elemento a arrastrar
step.web.drag.drop.param.target=Selector CSS o XPath del destino donde soltar
step.web.drag.resize.description=Redimensiona un elemento al ancho y alto indicados en píxeles
step.web.drag.resize.param.target=Selector CSS o XPath del elemento a redimensionar
step.web.drag.resize.param.width=Ancho objetivo en píxeles
step.web.drag.resize.param.height=Alto objetivo en píxeles

# ── Alertas ───────────────────────────────────────────────────────────────────
step.web.alert.accept.description=Acepta el diálogo de alerta del sistema (equivalente a clic en Aceptar)
step.web.alert.dismiss.description=Cancela el diálogo de alerta del sistema (equivalente a clic en Cancelar)

# ── Formularios ───────────────────────────────────────────────────────────────
step.web.input.fill.description=Escribe un valor en el campo identificado por su label o placeholder
step.web.input.fill.param.label=Label visible del campo de formulario
step.web.input.fill.param.value=Valor a ingresar en el campo
step.web.input.fill-nth.description=Escribe un valor en el n-ésimo campo con el label indicado (cuando hay más de uno)
step.web.input.fill-nth.param.index=Índice del campo cuando hay múiltiples con el mismo label (comienza en 1)
step.web.input.clear.description=Borra el contenido actual del campo indicado
step.web.input.upload-file.description=Sube un archivo al campo file indicado mediante setInputFiles
step.web.input.upload-file.param.filePath=Ruta absoluta o relativa al archivo a subir
step.web.input.upload-file.param.locator=Selector CSS o XPath del campo file

step.web.select.dropdown.description=Selecciona una opción de un elemento select/dropdown
step.web.select.dropdown.param.option=Texto de la opción a seleccionar
step.web.select.dropdown.param.dropdown=Label o nombre del dropdown

# ── Scroll ────────────────────────────────────────────────────────────────────
step.web.scroll.down.description=Desplaza la página hacia abajo
step.web.scroll.up.description=Desplaza la página hacia arriba
step.web.scroll.to.description=Desplaza la página hasta que el elemento sea visible
step.web.scroll.down-pixels.description=Desplaza la página hacia abajo el número exacto de píxeles indicado
step.web.scroll.down-until.description=Desplaza hacia abajo hasta que el elemento indicado sea visible
step.web.scroll.up-until.description=Desplaza hacia arriba hasta que el elemento indicado sea visible

# ── Esperas ───────────────────────────────────────────────────────────────────
step.web.wait.visible.description=Espera hasta que el elemento sea visible en la página
step.web.wait.hidden.description=Espera hasta que el elemento deje de ser visible

# ── Aserciones ────────────────────────────────────────────────────────────────
step.web.assert.visible.description=Verifica que el elemento sea visible en la página
step.web.assert.not-visible.description=Verifica que el elemento NO sea visible en la página
step.web.assert.text.description=Verifica que el elemento contenga el texto indicado
step.web.assert.title.description=Verifica que el título de la página sea el esperado
step.web.assert.url-contains.description=Verifica que la URL actual contenga el fragmento indicado
