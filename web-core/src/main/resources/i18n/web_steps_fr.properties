# ── Catégories ────────────────────────────────────────────────────────────────
step.web.category.navigation=Navigation
step.web.category.interaction=Interaction
step.web.category.forms=Formulaires
step.web.category.assertions=Assertions
step.web.category.wait=Attente
step.web.category.config=Configuration

# ── Paramètres communs ────────────────────────────────────────────────────────
step.web.click.param.locator=Texte visible, label ou sélecteur de l'élément
step.web.click.param.container=Sélecteur du conteneur parent
step.web.click.param.row=Index de ligne (commence à 1)
step.web.scroll.pixels.param.pixels=Nombre de pixels à faire défiler
step.web.assert.text.param.text=Texte attendu dans l'élément
step.web.assert.title.param.title=Titre exact attendu de la page
step.web.assert.url-contains.param.fragment=Fragment d'URL attendu dans la barre d'adresse

# ── Configuration ──────────────────────────────────────────────────────────────
step.web.config.navigate.description=Navigue vers l'URL indiquée au début du scénario
step.web.config.navigate.param.url=URL ou chemin relatif vers lequel naviguer

# ── Navigation ────────────────────────────────────────────────────────────────
step.web.navigation.go.description=Navigue le navigateur vers l'URL indiquée
step.web.navigation.go.param.url=URL complète ou chemin relatif de destination

step.web.navigation.new-tab.description=Ouvre un nouvel onglet dans le navigateur
step.web.navigation.maximize.description=Maximise la fenêtre du navigateur en plein écran
step.web.navigation.key.description=Appuie sur la touche indiquée (ex: Enter, Tab, Escape)
step.web.navigation.key.param.key=Nom de la touche (ex: Enter, Tab, F5)
step.web.navigation.combo.description=Appuie sur une combinaison de touches (ex: Ctrl+S)
step.web.navigation.combo.param.modifier=Touche modificatrice (ex: Control, Shift, Alt)
step.web.navigation.combo.param.key=Touche secondaire de la combinaison

# ── Frame ─────────────────────────────────────────────────────────────────────
step.web.frame.leave.description=Quitte l'iframe actif et retourne au contexte principal du document

# ── Clics et Interaction ──────────────────────────────────────────────────────
step.web.click.click.description=Clique sur l'élément identifié par son texte visible ou sélecteur
step.web.click.click-inside.description=Clique sur un élément à l'intérieur d'un conteneur spécifique
step.web.click.click-row.description=Clique sur un élément dans une ligne spécifique du tableau
step.web.click.double-click.description=Double-clique sur l'élément indiqué
step.web.click.right-click.description=Effectue un clic droit sur l'élément pour ouvrir le menu contextuel
step.web.click.hover.description=Déplace le curseur sur l'élément pour activer les effets de survol

# ── Alertes ───────────────────────────────────────────────────────────────────
step.web.alert.accept.description=Accepte la boîte de dialogue d'alerte système (équivalent à cliquer sur OK)
step.web.alert.dismiss.description=Ferme la boîte de dialogue d'alerte système (équivalent à cliquer sur Annuler)

# ── Formulaires ───────────────────────────────────────────────────────────────
step.web.input.fill.description=Saisit une valeur dans le champ identifié par son label ou placeholder
step.web.input.fill.param.label=Label visible du champ de formulaire
step.web.input.fill.param.value=Valeur à saisir dans le champ
step.web.input.fill-nth.description=Saisit une valeur dans le n-ième champ avec le label indiqué (quand il y en a plusieurs)
step.web.input.fill-nth.param.index=Index du champ quand plusieurs ont le même label (commence à 1)
step.web.input.clear.description=Efface le contenu actuel du champ indiqué

step.web.select.dropdown.description=Sélectionne une option dans un élément select/liste déroulante
step.web.select.dropdown.param.option=Texte de l'option à sélectionner
step.web.select.dropdown.param.dropdown=Label ou nom de la liste déroulante

# ── Défilement ────────────────────────────────────────────────────────────────
step.web.scroll.down.description=Fait défiler la page vers le bas
step.web.scroll.up.description=Fait défiler la page vers le haut
step.web.scroll.to.description=Fait défiler la page jusqu'à ce que l'élément soit visible
step.web.scroll.down-pixels.description=Fait défiler la page vers le bas du nombre exact de pixels indiqué
step.web.scroll.down-until.description=Fait défiler vers le bas jusqu'à ce que l'élément indiqué soit visible
step.web.scroll.up-until.description=Fait défiler vers le haut jusqu'à ce que l'élément indiqué soit visible

# ── Attente ───────────────────────────────────────────────────────────────────
step.web.wait.visible.description=Attend que l'élément soit visible sur la page
step.web.wait.hidden.description=Attend que l'élément ne soit plus visible

# ── Assertions ────────────────────────────────────────────────────────────────
step.web.assert.visible.description=Vérifie que l'élément est visible sur la page
step.web.assert.not-visible.description=Vérifie que l'élément N'est PAS visible sur la page
step.web.assert.text.description=Vérifie que l'élément contient le texte indiqué
step.web.assert.title.description=Vérifie que le titre de la page correspond à la valeur attendue
step.web.assert.url-contains.description=Vérifie que l'URL actuelle contient le fragment indiqué
