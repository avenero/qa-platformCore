# ── Categories ────────────────────────────────────────────────────────────────
step.web.category.navigation=Navigation
step.web.category.interaction=Interaction
step.web.category.forms=Forms
step.web.category.assertions=Assertions
step.web.category.wait=Wait
step.web.category.config=Configuration

# ── Common parameters ─────────────────────────────────────────────────────────
step.web.click.param.locator=Visible text, label or element selector
step.web.click.param.container=Selector of the parent container
step.web.click.param.row=Row index (starts at 1)
step.web.scroll.pixels.param.pixels=Number of pixels to scroll
step.web.assert.text.param.text=Expected text inside the element
step.web.assert.title.param.title=Exact expected page title
step.web.assert.url-contains.param.fragment=Expected URL fragment in the address bar

# ── Configuration ──────────────────────────────────────────────────────────────
step.web.config.navigate.description=Navigates to the given URL at the beginning of the scenario
step.web.config.navigate.param.url=URL or relative path to navigate to

# ── Navigation ────────────────────────────────────────────────────────────────
step.web.navigation.go.description=Navigates the browser to the given URL
step.web.navigation.go.param.url=Full URL or relative path to navigate to

step.web.navigation.new-tab.description=Opens a new tab in the browser
step.web.navigation.maximize.description=Maximizes the browser window to full screen
step.web.navigation.key.description=Presses the specified key (e.g. Enter, Tab, Escape)
step.web.navigation.key.param.key=Key name (e.g. Enter, Tab, F5)
step.web.navigation.combo.description=Presses a key combination (e.g. Ctrl+S)
step.web.navigation.combo.param.modifier=Modifier key (e.g. Control, Shift, Alt)
step.web.navigation.combo.param.key=Secondary key in the combination

# ── Frame ─────────────────────────────────────────────────────────────────────
step.web.frame.leave.description=Exits the active iframe and returns to the main document context

# ── Clicks and Interaction ────────────────────────────────────────────────────
step.web.click.click.description=Clicks the element identified by its visible text or selector
step.web.click.click-inside.description=Clicks an element within a specific container
step.web.click.click-row.description=Clicks an element within a specific table row
step.web.click.double-click.description=Double-clicks the specified element
step.web.click.right-click.description=Right-clicks the element to open the context menu
step.web.click.hover.description=Moves the cursor over the element to trigger hover effects

# ── Drag and Drop ─────────────────────────────────────────────────────────────
step.web.drag.drop.description=Drags an element and drops it onto a target element
step.web.drag.drop.param.source=CSS or XPath selector of the element to drag
step.web.drag.drop.param.target=CSS or XPath selector of the drop target
step.web.drag.resize.description=Resizes an element to the given width and height in pixels
step.web.drag.resize.param.target=CSS or XPath selector of the element to resize
step.web.drag.resize.param.width=Target width in pixels
step.web.drag.resize.param.height=Target height in pixels

# ── Alerts ────────────────────────────────────────────────────────────────────
step.web.alert.accept.description=Accepts the system alert dialog (equivalent to clicking OK)
step.web.alert.dismiss.description=Dismisses the system alert dialog (equivalent to clicking Cancel)

# ── Forms ─────────────────────────────────────────────────────────────────────
step.web.input.fill.description=Types a value into the field identified by its label or placeholder
step.web.input.fill.param.label=Visible label of the form field
step.web.input.fill.param.value=Value to enter in the field
step.web.input.fill-nth.description=Types a value into the n-th field with the given label (when multiple exist)
step.web.input.fill-nth.param.index=Field index when multiple fields share the same label (starts at 1)
step.web.input.clear.description=Clears the current content of the specified field
step.web.input.upload-file.description=Uploads a file to the given file input via setInputFiles
step.web.input.upload-file.param.filePath=Absolute or relative path to the file to upload
step.web.input.upload-file.param.locator=CSS or XPath selector of the file input

step.web.select.dropdown.description=Selects an option from a select/dropdown element
step.web.select.dropdown.param.option=Text of the option to select
step.web.select.dropdown.param.dropdown=Label or name of the dropdown

# ── Scroll ────────────────────────────────────────────────────────────────────
step.web.scroll.down.description=Scrolls the page downward
step.web.scroll.up.description=Scrolls the page upward
step.web.scroll.to.description=Scrolls the page until the element is visible
step.web.scroll.down-pixels.description=Scrolls the page down by the exact number of pixels specified
step.web.scroll.down-until.description=Scrolls down until the specified element is visible
step.web.scroll.up-until.description=Scrolls up until the specified element is visible

# ── Wait ──────────────────────────────────────────────────────────────────────
step.web.wait.visible.description=Waits until the element is visible on the page
step.web.wait.hidden.description=Waits until the element is no longer visible

# ── Assertions ────────────────────────────────────────────────────────────────
step.web.assert.visible.description=Asserts that the element is visible on the page
step.web.assert.not-visible.description=Asserts that the element is NOT visible on the page
step.web.assert.text.description=Asserts that the element contains the specified text
step.web.assert.title.description=Asserts that the page title matches the expected value
step.web.assert.url-contains.description=Asserts that the current URL contains the specified fragment
