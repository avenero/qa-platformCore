# ====================================================================
# WEB-CORE CONFIGURATION
# Framework Scotia QA - Configuración para Testing Web UI
# ====================================================================

# ====================================================================
# BROWSER CONFIGURATION
# ====================================================================
# Navegador a utilizar: chrome, firefox, edge, safari
browser=chrome

# Modo headless (sin interfaz gráfica): true, false
headless=false

# ====================================================================
# EXECUTION MODE
# ====================================================================
# Modo de ejecución: local, grid
execution.mode=local

# URL del Selenium Grid Hub (solo para modo grid)
grid.hub.url=http://localhost:4444/wd/hub

# ====================================================================
# TIMEOUTS (en segundos)
# ====================================================================
# Timeout implícito para localización de elementos
implicit.wait=10

# Timeout de carga de página
page.load.timeout=30

# Timeout explícito por defecto
explicit.wait=15

# ====================================================================
# APPLICATION URLS
# ====================================================================
# URL base de la aplicación bajo test
base.url=about:blank

# URLs específicas de entornos (opcional)
#base.url.dev=https://dev.example.com
#base.url.qa=https://qa.example.com
#base.url.staging=https://staging.example.com
#base.url.prod=https://www.example.com

# ====================================================================
# SCREENSHOTS
# ====================================================================
# Directorio para guardar screenshots
screenshot.path=target/screenshots

# Capturar screenshots en cada paso: true, false
screenshot.on.every.step=false

# Capturar screenshots solo en fallos: true, false
screenshot.on.failure=true

# ====================================================================
# PROXY CONFIGURATION (opcional)
# ====================================================================
# Configurar proxy si es necesario
#proxy.enabled=false
#proxy.url=http://proxy.company.com:8080

# ====================================================================
# BROWSER OPTIONS (opcional)
# ====================================================================
# Opciones adicionales para Chrome (separadas por coma)
#chrome.options=--disable-notifications,--disable-popup-blocking

# Opciones adicionales para Firefox
#firefox.options=--disable-notifications

# ====================================================================
# LOGGING
# ====================================================================
# Nivel de logging: DEBUG, INFO, WARNING, ERROR
log.level=INFO

# ====================================================================
# PARALLEL EXECUTION (opcional)
# ====================================================================
# Número de threads paralelos
#parallel.threads=1

